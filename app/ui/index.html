<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HubGPT</title>
<style>
:root{
  --bg:#0f1115;--panel:#161922;--panel2:#1c2030;--line:#262b3b;--text:#e8eaf0;--muted:#8d93a6;
  --accent:#e0a75e;--accent2:#7c8cff;--ok:#4cc38a;--bad:#ef6b6b;--warn:#e6b450;--shadow:0 8px 30px rgba(0,0,0,.35);
  --r:14px;--mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace;
}
:root[data-theme="light"]{
  --bg:#f5f4f0;--panel:#ffffff;--panel2:#f0efe9;--line:#e3e1d8;--text:#1d1f24;--muted:#6b6f7a;
  --accent:#b9772c;--accent2:#4b5bd6;--shadow:0 6px 24px rgba(30,30,20,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Devanagari",sans-serif}
a{color:var(--accent2)}
.app{display:grid;grid-template-columns:230px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8a5a2b);
  display:grid;place-items:center;color:#1a1208;font-weight:800}
.brand b{font-size:15px;letter-spacing:.3px}.brand small{display:block;color:var(--muted);font-size:11px}
nav button{all:unset;display:flex;align-items:center;gap:11px;width:100%;box-sizing:border-box;padding:9px 12px;
  border-radius:10px;color:var(--muted);cursor:pointer;margin:1px 0;font-weight:500}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
nav .sep{height:1px;background:var(--line);margin:10px 8px}
.side-status{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.run{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
main{overflow:auto;padding:26px 30px 120px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.flow{cursor:pointer;transition:transform .12s,border-color .12s}
.flow:hover{transform:translateY(-2px);border-color:var(--accent)}
.flow .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);margin-bottom:10px;color:var(--accent)}
.flow h3{margin:0 0 4px;font-size:15px}.flow p{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600;letter-spacing:.2px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;outline:none}
textarea{min-height:300px;resize:vertical;font-family:"Noto Sans Devanagari","Segoe UI",sans-serif;line-height:1.7}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#1b1206;border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}.btn.small{padding:5px 10px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
.actions{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.tab.on{color:var(--text);border-color:var(--accent)}
.list .item{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.list .item:last-child{border:0}
.item .meta{flex:1;min-width:0}.item .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta small{color:var(--muted)}
audio{height:34px;max-width:320px;width:100%}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{position:relative;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--panel2);aspect-ratio:16/9}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sel{border-color:var(--accent)}
.thumb span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:6px}
.jobs{display:grid;grid-template-columns:330px 1fr;gap:14px;height:calc(100vh - 150px)}
.joblist{overflow:auto;padding:6px}
.job{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.job:hover{background:var(--panel2)}.job.on{background:var(--panel2);border-color:var(--line)}
.job b{display:block;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.job small{color:var(--muted)}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);margin-left:6px}
.badge.running{color:var(--warn)}.badge.done{color:var(--ok)}.badge.failed{color:var(--bad)}.badge.stopped{color:var(--muted)}
.logbox{display:flex;flex-direction:column;min-height:0}
.log{flex:1;overflow:auto;background:#0b0d12;color:#cfd5e2;font:12.5px/1.55 var(--mono);padding:14px;border-radius:12px;
  white-space:pre-wrap;word-break:break-word;border:1px solid var(--line)}
:root[data-theme="light"] .log{background:#16181d}
.log .e{color:#ff8f8f}.log .s{color:#e0a75e;font-weight:600}.log .d{color:#79d6a4;font-weight:700}
.progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}
.dock{position:fixed;left:230px;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:5}
.dock .bar{display:flex;align-items:center;gap:12px;padding:8px 18px;cursor:pointer;font-size:13px}
.dock .bar .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dock .log{height:220px;border-radius:0;border:0;display:none}
.dock.open .log{display:block}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-size:18px}.stat small{color:var(--muted)}
.toast{position:fixed;right:22px;top:20px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
  padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;max-width:380px;animation:in .2s}
@keyframes in{from{transform:translateY(-8px);opacity:0}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:30;cursor:zoom-out}
.lightbox img,.lightbox video{max-width:92vw;max-height:88vh;border-radius:10px}
.lightbox p{color:#ddd;max-width:80vw;font-size:13px;text-align:center}
.empty{color:var(--muted);padding:20px;text-align:center}
.pill:empty{display:none}input[type=range]{accent-color:var(--accent)}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.range{display:flex;align-items:center;gap:10px}.range input{flex:1}
.hidden{display:none!important}
video.v{width:100%;border-radius:10px;background:#000;max-height:260px}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.dock{left:0}.jobs{grid-template-columns:1fr}main{padding:18px 16px 120px}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:40;padding:16px}
.modal.open{display:grid}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);padding:20px;max-height:90vh;overflow:auto}
.modal .box img{width:100%;border-radius:10px;display:block}
.switch{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;margin:6px 14px 6px 0}
.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked{background:color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.switch input:checked::after{left:18px;background:var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop.over,textarea.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.thumb .acts{position:absolute;inset:auto 6px 6px auto;display:none;gap:4px}
.thumb:hover .acts{display:flex}
.thumb .acts button{all:unset;cursor:pointer;background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px}
.thumb .acts button:hover{background:var(--accent);color:#1b1206}
.editor{display:flex;flex-direction:column;gap:8px}
.ed{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:grab}
.ed.drag{opacity:.4}.ed.over{border-color:var(--accent)}
.ed img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}
.ed .tx{flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ed input{width:76px}
.ed .x{all:unset;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}.ed .x:hover{color:var(--bad)}
.timeline{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:10px 0}
.timeline div{background-size:cover;background-position:center;border-right:2px solid var(--bg);position:relative;cursor:pointer;min-width:6px}
.timeline div span{position:absolute;left:4px;bottom:2px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
.capprev{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:#123 center/cover;display:flex;justify-content:center}
.capprev .t{position:absolute;left:8%;right:8%;text-align:center;line-height:1.35;text-shadow:0 0 4px #000,0 2px 6px #000}
.fontprev{font-size:22px;padding:10px 12px;background:var(--panel2);border-radius:10px;margin-top:6px;min-height:52px}
.colors{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.colors label{margin:0;display:flex;align-items:center;gap:8px}
input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn[disabled]{opacity:.5;pointer-events:none}
.sec{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin:18px 0 2px;font-weight:700}

/* ---------- v3 refinement: lighter, calmer, faster ---------- */
:root{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
:root{--bg:#0b0c10;--panel:#111318;--panel2:#171a21;--line:#22262f;--text:#ecedf1;--muted:#8a90a0;--accent:#d8a35c;--accent2:#8b9bff;--shadow:none;--r:12px}
:root[data-theme="light"]{--bg:#f6f5f2;--panel:#ffffff;--panel2:#f1efea;--line:#e6e3dc;--text:#16171b;--muted:#6d717c;--accent:#a8692a;--accent2:#4b5bd6;--shadow:none}
html,body{font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:216px 1fr}
aside{background:var(--bg);padding:16px 10px}
nav button{padding:8px 11px;font-size:13.5px;border-radius:9px}
nav button.on{background:var(--panel2);box-shadow:none;color:var(--text)}
nav button.on svg{color:var(--accent)}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e7b876,#9a6532)}
main{padding:30px 36px 120px}
main>*{max-width:1280px;margin-left:auto;margin-right:auto}
main>*{animation:fade .14s ease-out}@keyframes fade{from{opacity:0;transform:translateY(3px)}}
h1{font-size:24px;font-weight:650;letter-spacing:-.02em}
.sub{font-size:13.5px}
.card{box-shadow:none;border-radius:12px;padding:20px}
.flow:hover{transform:none;border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.flow .ic{background:color-mix(in srgb,var(--accent) 12%,transparent)}
label{font-weight:550;font-size:11.5px;letter-spacing:.3px}
input[type=text],input[type=number],textarea,select{border-radius:9px;background:var(--bg);transition:border-color .12s}
.btn{border-radius:9px;transition:border-color .12s,filter .12s}
.btn.primary{background:linear-gradient(180deg,#e2b06c,#c98f45);color:#1b1206}
:root[data-theme="light"] .btn.primary{background:linear-gradient(180deg,#c48843,#a8692a);color:#fff}
.chip{transition:.12s}
.dock{left:216px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px)}
.toast{border-radius:10px;font-size:13px}
.thumb{border-radius:9px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
@media (max-width:900px){.dock{left:0}main{padding:18px 16px 120px}}

details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
details.more>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:8px 0;display:flex;align-items:center;gap:8px;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more>summary:hover{color:var(--text)}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:10px;display:inline-block}.back:hover{color:var(--accent)}
.simple{max-width:780px}.simple .card textarea{min-height:240px}
.make{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.make.tools{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.make.tools .card{padding:16px 16px}.make.tools .ic{margin-bottom:6px}
.genre{position:relative}.genre .gname{font-size:34px;line-height:1.15;font-weight:700;color:var(--accent);margin-bottom:4px;font-family:"Nirmala UI","Mangal",serif}
.genre.soon{opacity:.55}.genre.soon .gname{color:var(--muted)}.genre .pill{position:absolute;top:14px;right:14px;font-size:11px}
.make .card{padding:22px 20px}
.make .card h3{font-size:15.5px}
.help ol,.help ul{margin:4px 0 4px 18px;padding:0;line-height:1.6}.help li{margin:4px 0}.help code{font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:5px}
.libbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.libbar .tabs{margin:0}.libbar input{max-width:240px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.ep{padding:0;overflow:hidden;display:flex;flex-direction:column}
.epart{height:150px;background:var(--panel2) center/cover no-repeat;position:relative}.epart .play{position:absolute;inset:auto 12px 12px auto;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer}
.epbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}.epbody small{color:var(--muted)}
.chips2{display:flex;gap:6px;flex-wrap:wrap}.chips2 span{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted)}.chips2 span.ok{color:var(--ok)}
.reelrow{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px}.btn.ghost{background:transparent;color:var(--muted)}.jx{margin-left:8px;color:var(--muted);cursor:pointer;font-weight:400}
.chkrow{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer;line-height:1.45}
.chkrow input{appearance:auto;-webkit-appearance:checkbox;width:16px;height:16px;flex:0 0 16px;margin-top:3px;accent-color:var(--accent)}
.motions{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:6px 0 4px}
.mtile{cursor:pointer;border:1px solid var(--line,#2a2a2a);border-radius:12px;padding:6px;text-align:center;font-size:12px;opacity:.85}
.mtile video,.mtile .mixbox{width:100%;aspect-ratio:9/16;border-radius:8px;object-fit:cover;background:#000;display:block}
.mtile .mixbox{display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--accent)}
.mtile span{display:block;margin-top:5px;line-height:1.25}
.mtile.sel{outline:2px solid var(--accent);opacity:1}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="logo">م</div><div><b>HubGPT</b><small>stories, voice, and video</small></div></div>
  <nav id="nav"></nav>

</aside>
<main id="main"></main>
</div>

<div class="lightbox" id="lb"><div style="display:grid;place-items:center;gap:10px"><div id="lbIn"></div><p id="lbP"></p></div></div>

<script>
window.HUB_EXPERIMENTAL_MODE=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const media=p=>"/media?p="+encodeURIComponent(p), base=p=>String(p).split(/[\\/]/).pop(), join=(d,f)=>d+(d.includes("\\")?"\\":"/")+f;
const api=async(u,o)=>{const r=await fetch(u,o&&{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});const j=await r.json().catch(()=>({error:"bad answer"}));if(!r.ok)throw new Error(j.error||r.status);return j};
const store={get(k,d){try{return JSON.parse(localStorage.getItem("hub_"+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem("hub_"+k,JSON.stringify(v))}catch(e){}}};
function toast(m,bad){const t=document.createElement("div");t.className="toast";if(bad)t.style.borderLeftColor="var(--bad)";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
const I={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 voice:'<path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',

async function upload(files){const out=[];for(const f of files){if(!/\.(png|jpe?g|webp)$/i.test(f.name)){toast(f.name+": only pictures",1);continue}
  const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});try{out.push((await api("/api/upload",{name:f.name,data})).file)}catch(e){toast(e.message,1)}}
  if(out.length){toast(`${out.length} picture(s) added`);await loadLib()}return out}
function dropImg(el,after){el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("over")});el.addEventListener("dragleave",()=>el.classList.remove("over"));
  el.addEventListener("drop",async e=>{e.preventDefault();el.classList.remove("over");const r=await upload([...e.dataTransfer.files]);after&&after(r)});
  el.addEventListener("click",()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.onchange=async()=>{const r=await upload([...i.files]);after&&after(r)};i.click()})}

async function drawSeries(r){const el=$("#serCard");if(!el)return;r=r||await api("/api/voice/series",{}).catch(()=>null);if(!r)return;P.ser=r;

R.repair=async()=>{await loadLib();const V=(P.lib.videos||[]).filter(v=>(v.kind=="episode"||v.kind=="reel")&&!/_preview|_motions/.test(v.file));
  $("main").innerHTML=`<div class="simple"><h1>Repair</h1><p class="sub">The repair man looks at a finished video or reel, lists what is wrong, and fixes what you tick. The old one is always kept.</p>
  <div class="card"><label>Video or reel</label><select id="xVid">${V.map(v=>`<option value="${esc(v.file)}">${v.kind=="reel"?"📱 ":"🎬 "}${esc(base(v.file))} · ${ago(v.time)}</option>`).join("")||'<option value="">no videos yet</option>'}</select>
   <div class="actions"><button class="btn primary" id="xCheck">Check it</button><span class="hint" id="xState"></span></div>
   <div id="xRep"></div></div></div>`;
  const ts=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
  const play=(f,t)=>`<a href="#" onclick="lightbox('${media(f)}#t=${Math.max(0,t-2)}','',1);return false">▶ ${ts(t)}</a>`;
  const show=async()=>{const v=$("#xVid").value;if(!v)return;const r=await api("/api/repair/report",{video:v}).catch(()=>({}));
    if(!r.checked){$("#xRep").innerHTML=`<div class="hint" style="margin-top:10px">Not checked yet.</div>`;return false}

    $("#xState").textContent="checked "+r.checked;
    if(r.auto&&!reel){$("#xRep").innerHTML=`<div class="hint" style="margin-top:10px">Only the motion was checked automatically when the video was made (${(r.motion||[]).length?(r.motion.length+" place(s)"):"smooth"}). Press <b>Check it</b> for voice + subtitles too.</div>`;return true}
    $("#xRep").innerHTML=(reel?"":`<h2>Voice ${vo.length?`· ${vo.length} line(s)`:"· all fine"}</h2>${vo.map(x=>`<label class="chkrow"><input type="checkbox" class="xLine" value="${x.line}" checked><span><b>line ${x.line}</b> ${esc(x.text)} <span class="hint">— ${esc(x.why.join(", "))}</span> ${play(v,x.at)}</span></label>`).join("")}
      <div class="hint">Another line sounds wrong? <a href="#" onclick='go("fix",((P.lib.episodes||[]).find(e=>e.video==${esc(JSON.stringify(v))})||{}).narration||"");return false'>Open all phrases (listen + tick any line)</a></div>
      <h2>Subtitles</h2><div class="hint">${su.count||0} on-screen lines · ${esc(su.note||"")}${su.mean_gap_s?` · about every ${su.mean_gap_s} s`:""}</div>${sw("xSubs","Rebuild subtitles from this video's narration",!!su.even)}

      `<h2>Motion ${mo.length?`· ${mo.length} place(s)`:"· smooth"}</h2>${mo.map(x=>`<div class="item" style="padding:4px 0"><span>${esc(x.kind)}</span> <span class="hint">${esc(x.why)}</span> ${play(v,x.at)}</div>`).join("")}
      ${reel?sw("xRemake","Make this reel again (same moment)",mo.length>0):sw("xLoop","Make the living artwork loop again (for loop pops)",mo.some(x=>x.kind=="loop pop"))}
      ${reel?"":sw("xQuick","Quick fix for voice lines: the new lines go into the same places, the picture is kept - only the sound is new (a few minutes instead of a whole render)",true)}

      store.set("xVid",v);startGo("repair",{video:v,voice_lines:lines,subtitles:subs,subtitle_text,motion:loop,quick:$("#xQuick").checked},e.currentTarget)};return true};
  const want=P.pick||store.get("xVid","");if(want&&[...$("#xVid").options].some(o=>o.value==want)){$("#xVid").value=want}P.pick=null;
  const running=()=>(JOBS||[]).find(j=>["queued","running"].includes(j.status)&&/^(Check|Repair)/.test(j.title)&&j.title.includes(base($("#xVid").value)));

// ---------------- FIX (phrases of one narration: listen, tick, remake - no numbers to type)
R.fix=async(dir)=>{dir=dir||store.get("fixDir","");store.set("fixDir",dir);
  const r=await api("/api/narration/lines",{dir}).catch(e=>({lines:[],err:e.message}));const L=r.lines||[],bad=L.filter(x=>x.why.length);
  $("main").innerHTML=`<div class="simple"><h1>Fix: ${esc(base(dir))}</h1><p class="sub">Listen, tick the phrases that sound wrong, press <b>Remake</b>. Only those phrases are spoken again${r.video?" and put back into the video in the same places (the picture is kept)":""}. The old voice is always kept.</p>
  <div class="card">${r.audio?`<audio id="fxAud" controls preload="metadata" src="${media(r.audio)}" style="width:100%"></audio>`:""}
   <div class="row" style="align-items:center;margin-top:8px"><div class="hint" style="flex:1">${L.length} phrases · ${bad.length?`<b style="color:var(--warn)">${bad.length} sound off</b> (already ticked)`:"none flagged by the checker"} · ▶ plays a phrase</div>
    ${sw("fxAll","Show all phrases",!bad.length)}</div>
   <div id="fxList" style="max-height:52vh;overflow:auto;margin-top:6px"></div>
   ${r.video?sw("fxVid","Also fix the video (quick: only the sound is new)",true):`<div class="hint">No video made from this voice yet — only the voice is fixed.</div>`}
   <div class="actions"><button class="btn primary" id="fxGo">Remake ticked phrases</button><span class="hint" id="fxN"></span></div></div></div>`;
  const ts=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`,tick=new Set(bad.map(x=>x.n));
  const draw=()=>{const all=$("#fxAll").checked;$("#fxList").innerHTML=L.filter(x=>all||x.why.length||tick.has(x.n)).map(x=>`<label class="chkrow"><input type="checkbox" class="fxL" value="${x.n}" ${tick.has(x.n)?"checked":""}><span><b>${x.n}</b> ${esc(x.text)}${x.why.length?` <span class="hint" style="color:var(--warn)">— ${esc(x.why.join(", "))}</span>`:""} <a href="#" data-t="${x.start}" class="fxP">▶ ${ts(x.start)}</a></span></label>`).join("")||'<div class="empty">nothing flagged — switch on “Show all phrases”</div>';
    $$(".fxL").forEach(c=>c.onchange=()=>{c.checked?tick.add(+c.value):tick.delete(+c.value);cnt()});
    $$(".fxP").forEach(a=>a.onclick=e=>{e.preventDefault();const au=$("#fxAud");if(au){au.currentTime=Math.max(0,+a.dataset.t-0.3);au.play()}})};
  const cnt=()=>{$("#fxN").textContent=tick.size?`${tick.size} phrase(s): ${[...tick].sort((a,b)=>a-b).join(", ")}`:"nothing ticked"};
  $("#fxAll").addEventListener("change",draw);draw();cnt();
  $("#fxGo").onclick=e=>{if(!tick.size)return toast("Tick the phrases that sound wrong",1);const nums=[...tick].sort((a,b)=>a-b);
    if(r.video&&$("#fxVid").checked)return startGo("repair",{video:r.video,voice_lines:nums,quick:true},e.currentTarget);
    startGo("voice",{name:base(dir),redo:nums.join(","),takes:3},e.currentTarget)};
};

R.jobs=async()=>{

let JOBS=[];
function drawJobs(){const el=$("#jl");if(!el)return;el.innerHTML=JOBS.map(j=>`<div class="job ${j.id==P.job?"on":""}" data-id="${j.id}" onclick="selJob('${j.id}')"><b>${esc(j.title)}<span class="badge ${j.status}">${j.status}</span>${["done","failed","stopped"].includes(j.status)?`<span class="jx" title="Remove from the list" onclick="event.stopPropagation();clearJobs(['${j.id}'])">✕</span>`:""}</b><small>${new Date(j.created*1000).toLocaleString()}${j.status=="running"?` · step ${j.step+1}/${j.n_steps}`:""}</small></div>`).join("")||'<div class="empty">No jobs yet.</div>'}
async function clearJobs(ids){const r=await api("/api/jobs/clear",{ids:ids||[]});toast(`${r.cleared} job(s) cleared`);if(ids&&ids.includes(P.job))P.job=null;await refreshJobs();if(P.page=="jobs")R.jobs()}
function colorLog(t){return esc(t).replace(/^(?!\s*&gt; )(.*(!!|Traceback|\bError\b|finished with code|did not succeed).*)$/gm,'<span class="e">$1</span>').replace(/^(\[\d+\/\d+\].*)$/gm,'<span class="s">$1</span>').replace(/^(DONE.*)$/gm,'<span class="d">$1</span>')}
async function selJob(id){P.job=id;P.logNext=0;$("#jlog")&&($("#jlog").innerHTML="");$$(".job").forEach(e=>e.classList.toggle("on",e.dataset.id==id));await pollJob(true)}
async function pollJob(first){if(P.page!="jobs"||!P.job||!$("#jlog"))return;const j=JOBS.find(x=>x.id==P.job);
  try{const r=await api(`/api/jobs/${P.job}/log?from=${P.logNext}`);const L=$("#jlog");const atEnd=L.scrollTop+L.clientHeight>=L.scrollHeight-30;
   if(r.text){L.insertAdjacentHTML("beforeend",colorLog(r.text));if(atEnd||first)L.scrollTop=L.scrollHeight}P.logNext=r.next;
   $("#jt").textContent=j?j.title:P.job;$("#js").textContent=`${r.status}${r.step_label?" · "+r.step_label:""}`;
   $("#jp").style.width=(r.status=="done"?100:Math.round(100*(r.step||0)/Math.max(1,r.n_steps)))+"%";
   $("#jStop").onclick=async()=>{const r=await api(`/api/jobs/${P.job}/stop`,{});toast(r.ok?"Stop requested…":"This job is no longer running",!r.ok)};
   $("#jAgain").onclick=async()=>{const k=await api(`/api/jobs/${P.job}/again`,{});P.job=k.id;await refreshJobs();selJob(k.id)};
   $("#jOut").onclick=()=>j&&j.outputs&&j.outputs[0]?openP(j.outputs[0],["genre","horror"].includes(j.kind)):toast("no result yet",1);
  }catch(e){}}
async function refreshJobs(){const js=await api("/api/jobs");
  for(const j of js){const was=P.known[j.id];if(was&&was!=j.status&&["done","failed","stopped"].includes(j.status)&&!j.title.startsWith("Preview")){toast((j.status=="done"?"✓ Finished: ":"✕ "+j.status+": ")+j.title,j.status!="done");P.lib=null;if(["style_index","audio_index"].includes(j.kind))P.presets=null;if(["lib","home"].includes(P.page))R[P.page]()}P.known[j.id]=j.status}
  JOBS=js;checkPreview(js);drawJobs()}

  <h2>Your thumbnail style guide</h2><div class="card"><div class="row" style="align-items:center"><div><b>${P.presets.index.count} of ${P.presets.index.found} thumbnails indexed</b><div class="hint">${P.presets.index.built?"last built "+esc(P.presets.index.built):"not built yet"} · the vision AI looks at each once; new pictures make the “Sukoon thumbnails” / “Kisse thumbnails” looks and the “Inspired by” picker</div></div>
   <div style="flex:0;display:flex;gap:8px"><button class="btn primary" onclick='startGo("style_index",{})'>Build / update</button><button class="btn small" onclick='startGo("style_index",{rebuild:true})'>Rebuild all</button></div></div></div>
  <h2>Open another project's own window</h2><div class="actions">${Object.entries(P.presets.other_windows).map(([k,v])=>`<button class="btn" onclick='openP(${esc(JSON.stringify(v))})'>${esc(k)}</button>`).join("")}</div>
  ${(()=>{const L=P.presets.locations||{};return `<h2>HubGPT folders</h2><div class="card"><div class="hint">Hub output: ${esc(L.hub||"")} · Scripts: ${esc(L.scripts||"")} · Narrations: ${esc(L.narrations||"")} · Episodes and video output: ${esc(L.episodes||"")} · HubGPT Voice data: ${esc(L.voice_data||"")} · Voice model: ${esc(L.voice_models||"")} · Model copy: ${esc(L.voice_model_copy||"")} · HubGPT Video engine: ${esc(L.video_engine||"")}</div></div>`})()}`;
  loadOllamaModels();renderStats();storyCard();drawSeries();drawLlm();rackCard()};
async function drawLlm(r){const el=$("#llmCard");if(!el)return;r=r||await api("/api/llm",{}).catch(e=>({error:e.message,models:[]}));
  if(r.error&&!r.models.length){el.innerHTML=`<div class="hint">${esc(r.error)} — start ${esc(r.backend||"local AI")}.</div>`;return}
  el.innerHTML=`<div class="hint">Models served by ${esc(r.backend||"local AI")} are used for scripts when Gemini can't answer, picture ideas, moments and titles.</div>
  <div class="list" style="margin-top:8px">${r.models.slice(0,3).map((m,i)=>`<label class="item" style="cursor:pointer"><div class="meta"><b>${i==0?"★ ":""}${esc(m.name)}</b></div><input type="radio" name="llmPick" value="${esc(m.name)}" ${m.name==r.current?"checked":""}></label>`).join("")}</div>
   <label>…or any installed model</label><select id="llmAny">${r.models.map(m=>`<option ${m.name==r.current?"selected":""}>${esc(m.name)}</option>`).join("")}</select>
   <div class="actions"><button class="btn primary" onclick="setLlm()">Set general model</button><span class="hint">now: ${esc(r.current||"")}</span></div>
   <label>Image-prompt model (Qwen)</label><select id="promptModel">${r.models.map(m=>`<option value="${esc(m.name)}" ${m.name===r.prompt_model?"selected":""}>${esc(m.name)}</option>`).join("")}</select>
   <div class="actions"><button class="btn" onclick="setPromptModel()">Set prompt model</button><span class="hint">now: ${esc(r.prompt_model||"")}</span></div>`;
  $$('input[name=llmPick]').forEach(x=>x.onchange=()=>{$("#llmAny").value=x.value})}
async function setLlm(){try{drawLlm(await api("/api/llm",{llm:$("#llmAny").value}));toast("Local model saved")}catch(e){toast(e.message,1)}}
async function setPromptModel(){try{drawLlm(await api("/api/llm",{prompt_model:$("#promptModel").value}));toast("Prompt model saved")}catch(e){toast(e.message,1)}}
async function storyCard(){const S=await api("/api/story/status"),models=S.local_models||[],chosen=models.includes(S.local)?S.local:(models[0]||S.local);$("#storyCard").innerHTML=`<div class="row" style="align-items:center"><div><b>${S.gemini?"Gemini key saved ✓":"No Gemini key yet"}</b> · model ${esc(S.gemini_model)} · local fallback ${esc(S.local)} · ${S.ledger} scripts remembered (no repeats)<div class="hint">The key stays on this PC (secrets.json in the hub folder) and is never shown here again. Free tier: Google may use prompts to improve its products.</div></div></div>
   <div class="row"><div><label>Local model for stories</label><select id="localStoryModel">${models.map(m=>'<option value="'+esc(m)+'" '+(m===chosen?"selected":"") +'>'+esc(m)+'</option>').join("")}</select></div><div><label>Story writer mode</label><select id="storyEngine"><option value="auto" ${S.story_engine!=="local"?"selected":""}>Auto (Gemini, then local)</option><option value="local" ${S.story_engine==="local"?"selected":""}>Local only</option></select></div></div>
   <div class="row"><div><label>Gemini API key (Google AI Studio)</label><input id="gKey" type="password" placeholder="${S.gemini?"saved - paste a new one to replace":"paste your key"}" autocomplete="off"></div><div><label>Model</label><input id="gModel" type="text" value="${esc(S.gemini_model)}"></div></div>
   <div class="actions"><button class="btn primary" id="gSave">Save</button><button class="btn" onclick='openP(${esc(JSON.stringify(S.bank))})'>Edit topic bank</button><button class="btn" onclick='openP(${esc(JSON.stringify(S.ledger_file))})'>Ledger</button>${S.gemini?'<button class="btn small" id="gForget">Remove key</button>':""}</div>`;
  $("#gSave").onclick=async()=>{await api("/api/story/settings",{gemini_key:$("#gKey").value,gemini_model:$("#gModel").value,local_model:$("#localStoryModel").value,story_engine:$("#storyEngine").value});toast("Saved");storyCard()};
  if($("#gForget"))$("#gForget").onclick=async()=>{await api("/api/story/settings",{forget_key:true});toast("Key removed");storyCard()};
  $("#elemCard").innerHTML=`<div><b>${S.pixabay?"Pixabay key saved ✓":"No Pixabay key yet"}</b><div class="hint">When a script or picture needs steam, candles, rain, fireflies, snow, fog ... and the library has fewer than 3 clips of it, the hub finds a few on Pixabay in the background (no graphics card): Pixabay Content License only (commercial use, no credit), real names, every clip in the register D:\\Audio asset\\Elements\\ELEMENTS_INDEX.csv with source, licence and where it is used. Search results come from Pixabay.</div></div>
   <div class="row"><div><label>Pixabay API key (free, pixabay.com/api/docs)</label><input id="pKey" type="password" autocomplete="off" placeholder="${S.pixabay?"saved - paste a new one to replace":"paste your key"}"></div></div>
   <div class="actions"><button class="btn primary" id="pSave">Save</button><button class="btn" onclick='startGo("elements_fetch",{})'>Check the library now</button><button class="btn" onclick='openP("D:\\Audio asset\\Elements")'>Open the library</button>${S.pixabay?'<button class="btn small" id="pForget">Remove key</button>':""}</div>`;
  $("#pSave").onclick=async()=>{await api("/api/story/settings",{pixabay_key:$("#pKey").value});toast("Saved");storyCard()};
  if($("#pForget"))$("#pForget").onclick=async()=>{await api("/api/story/settings",{forget_pixabay:true});toast("Key removed");storyCard()};
  $("#elemCard").insertAdjacentHTML("beforeend",`<div style="margin-top:16px"><b>${S.freesound?"Freesound key saved ✓":"Sound effects: no Freesound key yet"}</b><div class="hint">For भय, रहस्य, किस्से … the hub fills D:\\Audio asset\\SFX\\&lt;kind&gt;\\ (door_knock, footsteps, rain, train …) with sounds from Freesound — ONLY “Creative Commons 0” (public domain: commercial use, no credit). Every file is in SFX_INDEX.csv with its page, author, licence and the videos it is used in. Only what is missing is fetched, when a series video is made.</div>
   <div class="row"><div><label>Freesound API key (free: freesound.org/apiv2/apply)</label><input id="fsKey" type="password" autocomplete="off" placeholder="${S.freesound?"saved - paste a new one to replace":"paste your key"}"></div></div>
   <div class="actions"><button class="btn primary" id="fsSave">Save</button><button class="btn" onclick='startGo("sfx_fetch",{})'>Fill the library now (all series)</button><button class="btn" onclick='openP("D:\\Audio asset\\SFX")'>Open the library</button></div></div>`);
  $("#fsSave").onclick=async()=>{await api("/api/story/settings",{freesound_key:$("#fsKey").value});toast("Saved");storyCard()}}
async function sysA(a){const r=await api("/api/system",{action:a});toast(r.msg,!r.ok)}
async function loadOllamaModels(){const el=$("#ollamaModel");if(!el)return [];const r=await api("/api/llm",{}).catch(e=>({models:[],error:e.message}));el.innerHTML=r.models?.length?r.models.map(m=>`<option value="${esc(m.name)}" ${m.name===r.current?"selected":""}>${esc(m.name)}</option>`).join(""):`<option value="">${esc(r.error||"No Ollama models found")}</option>`;return r.models||[]}
async function useOllamaModel(){const name=$("#ollamaModel").value;if(!name)return;try{await api("/api/llm",{llm:name});drawLlm(await api("/api/llm",{}));storyCard();toast(`Using ${name}`)}catch(e){toast(e.message,1)}}
async function startOllama(){try{const r=await api("/api/system",{action:"start_ollama"});toast(r.msg,!r.ok);if(!r.ok)return;
  for(let i=0;i<30;i++){await new Promise(resolve=>setTimeout(resolve,1000));const found=await api("/api/llm",{}).catch(()=>null);if(found&&found.models&&found.models.length){await loadOllamaModels();const active=$("#ollamaModel").value;if(active)await api("/api/llm",{llm:active});drawLlm(await api("/api/llm",{}));storyCard();toast(`Ollama ready: ${active||"ready"}`);return}}
  toast("Ollama is still starting. Refresh its model list in System when ready.",1)
 }catch(e){toast(e.message,1)}}
function toggleTheme(){const t=document.documentElement.dataset.theme=="light"?"dark":"light";document.documentElement.dataset.theme=t;store.set("theme",t)}

// ---------------- live status + dock
async function tick(){try{P.status=await api("/api/status")}catch(e){$("#sideStatus").innerHTML='<span class="dot bad"></span>hub not reachable';return}
  const s=P.status,aiUp=s.ollama;$("#sideStatus").innerHTML=`<div><span class="dot ${s.running?"run":"ok"}"></span>${s.running?"working":"idle"}${s.queued?` · ${s.queued} waiting`:""}</div><div><span class="dot ${s.comfy?"ok":""}"></span>ComfyUI · <span class="dot ${aiUp?"ok":""}"></span>Ollama</div>${s.gpu?`<div>GPU ${Math.round(s.gpu.mem_used/102.4)/10} GB · ${s.gpu.util}%</div>`:""}`;
  $("#dockDot").className="dot "+(s.running?"run":"ok");$("#dockQ").textContent=s.queued?`${s.queued} waiting`:"";
  $("#dockT").textContent=s.running?`${s.running.title} — step ${s.running.step+1}/${s.running.n_steps}: ${s.running.step_label}`:"No job running";
  try{await refreshJobs()}catch(e){}
  if(!s.running&&!P.dockJob&&JOBS[0])P.dockJob=JOBS[0].id;
  const id=s.running?.id||P.dockJob;if(id&&id!=P.dockJob){P.dockJob=id;P.dockNext=0;$("#dockLog").innerHTML=""}
  if(P.dockJob&&$("#dock").classList.contains("open")){try{const r=await api(`/api/jobs/${P.dockJob}/log?from=${P.dockNext}`);if(r.text){const L=$("#dockLog");L.insertAdjacentHTML("beforeend",colorLog(r.text));L.scrollTop=L.scrollHeight}P.dockNext=r.next}catch(e){}}
  if(P.page=="jobs")await pollJob();if(P.page=="home"||P.page=="sys")renderStats();
  if(!P.stampAt||Date.now()-P.stampAt>8000){P.stampAt=Date.now();                 // new things made? show them without a restart
    try{const st=(await api("/api/library/stamp")).stamp;if(P.stamp&&st!==P.stamp){P.lib=null;
      const playing=[...document.querySelectorAll("video,audio")].some(m=>!m.paused);
      if(["lib","home"].includes(P.page)&&!playing&&!document.activeElement.matches?.("input,textarea,select"))R[P.page]();
      else if(["reels","repair","episode"].includes(P.page))toast("New items made - they are in the lists next time you open this page")}
     P.stamp=st}catch(e){}}}
$("#dockBar").onclick=()=>{$("#dock").classList.toggle("open");$("#dockArrow").textContent=$("#dock").classList.contains("open")?"▼ log":"▲ log"};
document.documentElement.dataset.theme=store.get("theme","dark");
(async()=>{try{await pre()}catch(e){}nav();go(store.get("page","home"));tick();setInterval(tick,1500)})();
</script>
