<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HubGPT · Experimental</title>
<style>
:root{
  --bg:#0f1115;--panel:#161922;--panel2:#1c2030;--line:#262b3b;--text:#e8eaf0;--muted:#8d93a6;
  --accent:#e0a75e;--accent2:#7c8cff;--ok:#4cc38a;--bad:#ef6b6b;--warn:#e6b450;--shadow:0 8px 30px rgba(0,0,0,.35);
  --r:14px;--mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",monospace;
}
:root[data-theme="light"]{
  --bg:#f5f4f0;--panel:#ffffff;--panel2:#f0efe9;--line:#e3e1d8;--text:#1d1f24;--muted:#6b6f7a;
  --accent:#b9772c;--accent2:#4b5bd6;--shadow:0 6px 24px rgba(30,30,20,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Devanagari",sans-serif}
a{color:var(--accent2)}
.app{display:grid;grid-template-columns:230px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#8a5a2b);
  display:grid;place-items:center;color:#1a1208;font-weight:800}
.brand b{font-size:15px;letter-spacing:.3px}.brand small{display:block;color:var(--muted);font-size:11px}
nav button{all:unset;display:flex;align-items:center;gap:11px;width:100%;box-sizing:border-box;padding:9px 12px;
  border-radius:10px;color:var(--muted);cursor:pointer;margin:1px 0;font-weight:500}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
nav .sep{height:1px;background:var(--line);margin:10px 8px}
.side-status{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.run{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
main{overflow:auto;padding:26px 30px 120px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.flow{cursor:pointer;transition:transform .12s,border-color .12s}
.flow:hover{transform:translateY(-2px);border-color:var(--accent)}
.flow .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);margin-bottom:10px;color:var(--accent)}
.flow h3{margin:0 0 4px;font-size:15px}.flow p{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600;letter-spacing:.2px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;outline:none}
textarea{min-height:300px;resize:vertical;font-family:"Noto Sans Devanagari","Segoe UI",sans-serif;line-height:1.7}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#1b1206;border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}.btn.small{padding:5px 10px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
.actions{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.tab.on{color:var(--text);border-color:var(--accent)}
.list .item{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.list .item:last-child{border:0}
.item .meta{flex:1;min-width:0}.item .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta small{color:var(--muted)}
audio{height:34px;max-width:320px;width:100%}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{position:relative;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--panel2);aspect-ratio:16/9}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sel{border-color:var(--accent)}
.thumb span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:6px}
.jobs{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:14px;height:calc(100vh - 150px);min-width:0;max-width:100%;min-height:0}
.jobs>*{min-width:0;max-width:100%}
.joblist{overflow:auto;padding:6px}
.job{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.job:hover{background:var(--panel2)}.job.on{background:var(--panel2);border-color:var(--line)}
.job b{display:block;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.job small{color:var(--muted)}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);margin-left:6px}
.badge.running{color:var(--warn)}.badge.done{color:var(--ok)}.badge.failed{color:var(--bad)}.badge.stopped{color:var(--muted)}
.logbox{display:flex;flex-direction:column;min-height:0;min-width:0;max-width:100%;overflow:auto}
.jobs .log{height:62vh;min-height:300px;flex:0 0 auto;resize:vertical}
.jobs{height:auto;align-items:start}.jobs .joblist{position:sticky;top:12px;max-height:calc(100vh - 160px)}.jobs .logbox{overflow:visible}
.joblist .job{padding:6px 10px;margin-bottom:2px}.joblist .job b{font-size:12.5px}.joblist .job small{font-size:11px}
.jnotes summary{cursor:pointer;font-weight:600}.jnotes #jobNoteList{max-height:180px;overflow:auto}.jnotes textarea{resize:vertical;max-height:200px}
.badge.paused{color:var(--warn);border-style:dashed}
.log{flex:1;overflow:auto;background:#0b0d12;color:#cfd5e2;font:12.5px/1.55 var(--mono);padding:14px;border-radius:12px;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;min-width:0;max-width:100%;overflow-anchor:none;contain:layout;border:1px solid var(--line)}
:root[data-theme="light"] .log{background:#16181d}
.log .e{color:#ff8f8f}.log .s{color:#e0a75e;font-weight:600}.log .d{color:#79d6a4;font-weight:700}
.progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}
.dock{position:fixed;left:230px;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:5}
.dock .bar{display:flex;align-items:center;gap:12px;padding:8px 18px;cursor:pointer;font-size:13px}
.dock .bar .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dock .log{height:220px;border-radius:0;border:0;display:none}
.dock.open .log{display:block}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font-size:18px}.stat small{color:var(--muted)}
.toast{position:fixed;right:22px;top:20px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
  padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;max-width:380px;animation:in .2s}
@keyframes in{from{transform:translateY(-8px);opacity:0}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:30;cursor:zoom-out}
.lightbox img,.lightbox video{max-width:92vw;max-height:88vh;border-radius:10px}
.lightbox p{color:#ddd;max-width:80vw;font-size:13px;text-align:center}
.empty{color:var(--muted);padding:20px;text-align:center}
.pill:empty{display:none}input[type=range]{accent-color:var(--accent)}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.range{display:flex;align-items:center;gap:10px}.range input{flex:1}
.hidden{display:none!important}
video.v{width:100%;border-radius:10px;background:#000;max-height:260px}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.dock{left:0}.jobs{grid-template-columns:1fr}main{padding:18px 16px 120px}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:40;padding:16px}
.modal.open{display:grid}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);padding:20px;max-height:90vh;overflow:auto}
.modal .box img{width:100%;border-radius:10px;display:block}
.switch{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;margin:6px 14px 6px 0}
.switch input{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer;transition:.2s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked{background:color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.switch input:checked::after{left:18px;background:var(--accent)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop.over,textarea.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.thumb .acts{position:absolute;inset:auto 6px 6px auto;display:none;gap:4px}
.thumb:hover .acts{display:flex}
.thumb .acts button{all:unset;cursor:pointer;background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px}
.thumb .acts button:hover{background:var(--accent);color:#1b1206}
.editor{display:flex;flex-direction:column;gap:8px}
.ed{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:grab}
.ed.drag{opacity:.4}.ed.over{border-color:var(--accent)}
.ed img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}
.ed .tx{flex:1;min-width:0;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ed input{width:76px}
.ed .x{all:unset;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}.ed .x:hover{color:var(--bad)}
.timeline{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:10px 0}
.timeline div{background-size:cover;background-position:center;border-right:2px solid var(--bg);position:relative;cursor:pointer;min-width:6px}
.timeline div span{position:absolute;left:4px;bottom:2px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
.capprev{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:#123 center/cover;display:flex;justify-content:center}
.capprev .t{position:absolute;left:8%;right:8%;text-align:center;line-height:1.35;text-shadow:0 0 4px #000,0 2px 6px #000}
.fontprev{font-size:22px;padding:10px 12px;background:var(--panel2);border-radius:10px;margin-top:6px;min-height:52px}
.colors{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.colors label{margin:0;display:flex;align-items:center;gap:8px}
input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px;cursor:pointer}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn[disabled]{opacity:.5;pointer-events:none}
.sec{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);margin:18px 0 2px;font-weight:700}

/* ---------- v3 refinement: lighter, calmer, faster ---------- */
:root{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
:root{--bg:#0b0c10;--panel:#111318;--panel2:#171a21;--line:#22262f;--text:#ecedf1;--muted:#8a90a0;--accent:#d8a35c;--accent2:#8b9bff;--shadow:none;--r:12px}
:root[data-theme="light"]{--bg:#f6f5f2;--panel:#ffffff;--panel2:#f1efea;--line:#e6e3dc;--text:#16171b;--muted:#6d717c;--accent:#a8692a;--accent2:#4b5bd6;--shadow:none}
html,body{font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:216px 1fr}
aside{background:var(--bg);padding:16px 10px}
nav button{padding:8px 11px;font-size:13.5px;border-radius:9px}
nav button.on{background:var(--panel2);box-shadow:none;color:var(--text)}
nav button.on svg{color:var(--accent)}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e7b876,#9a6532)}
main{padding:30px 36px 120px}
main>*{max-width:1280px;margin-left:auto;margin-right:auto}
main>*{animation:fade .14s ease-out}@keyframes fade{from{opacity:0;transform:translateY(3px)}}
h1{font-size:24px;font-weight:650;letter-spacing:-.02em}
.sub{font-size:13.5px}
.card{box-shadow:none;border-radius:12px;padding:20px}
.flow:hover{transform:none;border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.flow .ic{background:color-mix(in srgb,var(--accent) 12%,transparent)}
label{font-weight:550;font-size:11.5px;letter-spacing:.3px}
input[type=text],input[type=number],textarea,select{border-radius:9px;background:var(--bg);transition:border-color .12s}
.btn{border-radius:9px;transition:border-color .12s,filter .12s}
.btn.primary{background:linear-gradient(180deg,#e2b06c,#c98f45);color:#1b1206}
:root[data-theme="light"] .btn.primary{background:linear-gradient(180deg,#c48843,#a8692a);color:#fff}
.chip{transition:.12s}
.dock{left:216px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px)}
.toast{border-radius:10px;font-size:13px}
.thumb{border-radius:9px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
@media (max-width:900px){.dock{left:0}main{padding:18px 16px 120px}}

details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
details.more>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:8px 0;display:flex;align-items:center;gap:8px;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:2px}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more>summary:hover{color:var(--text)}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:10px;display:inline-block}.back:hover{color:var(--accent)}
.simple{max-width:780px}.simple .card textarea{min-height:240px}
.make{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.make.tools{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.make.tools .card{padding:16px 16px}.make.tools .ic{margin-bottom:6px}
.genre{position:relative}.genre .gname{font-size:34px;line-height:1.15;font-weight:700;color:var(--accent);margin-bottom:4px;font-family:"Nirmala UI","Mangal",serif}
.genre.soon{opacity:.55}.genre.soon .gname{color:var(--muted)}.genre .pill{position:absolute;top:14px;right:14px;font-size:11px}
.make .card{padding:22px 20px}
.make .card h3{font-size:15.5px}
.help ol,.help ul{margin:4px 0 4px 18px;padding:0;line-height:1.6}.help li{margin:4px 0}.help code{font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:5px}
.libbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.libbar .tabs{margin:0}.libbar input{max-width:240px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.ep{padding:0;overflow:hidden;display:flex;flex-direction:column}
.epart{height:150px;background:var(--panel2) center/cover no-repeat;position:relative}.epart .play{position:absolute;inset:auto 12px 12px auto;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer}
.epbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}.epbody small{color:var(--muted)}
.chips2{display:flex;gap:6px;flex-wrap:wrap}.chips2 span{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--muted)}.chips2 span.ok{color:var(--ok)}
.reelrow{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px}.btn.ghost{background:transparent;color:var(--muted)}.jx{margin-left:8px;color:var(--muted);cursor:pointer;font-weight:400}
.chkrow{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer;line-height:1.45}
.chkrow input{appearance:auto;-webkit-appearance:checkbox;width:16px;height:16px;flex:0 0 16px;margin-top:3px;accent-color:var(--accent)}
.motions{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:6px 0 4px}
.mtile{cursor:pointer;border:1px solid var(--line,#2a2a2a);border-radius:12px;padding:6px;text-align:center;font-size:12px;opacity:.85}
.mtile video,.mtile .mixbox{width:100%;aspect-ratio:9/16;border-radius:8px;object-fit:cover;background:#000;display:block}
.mtile .mixbox{display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--accent)}
.mtile span{display:block;margin-top:5px;line-height:1.25}
.mtile.sel{outline:2px solid var(--accent);opacity:1}
/* EXPERIMENTAL VISUAL REFRESH — presentation only; existing controls and pipeline remain intact. */
:root{color-scheme:light;--bg:#f3f6f5;--panel:#fff;--panel2:#eef3f2;--line:#d9e3e1;--text:#183038;--muted:#5d747b;--accent:#147b73;--accent2:#345f9c;--ok:#21865e;--bad:#c63f43;--warn:#a76a14;--shadow:0 8px 24px rgba(25,55,60,.07);--r:16px}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f6f5;--panel:#fff;--panel2:#eef3f2;--line:#d9e3e1;--text:#183038;--muted:#5d747b;--accent:#147b73;--accent2:#345f9c;--shadow:0 8px 24px rgba(25,55,60,.07)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11191b;--panel:#192326;--panel2:#202d30;--line:#314145;--text:#ecf4f3;--muted:#a6b9ba;--accent:#78c8bb;--accent2:#a1baff;--ok:#68d09e;--bad:#ff8787;--warn:#f0c16b;--shadow:0 10px 28px rgba(0,0,0,.2)}
html,body{min-height:100%;letter-spacing:0;-webkit-font-smoothing:antialiased}

// ---------------- VOICE
function voiceForm(prefix){const pr=P.presets;return `
   <div id="${prefix}SukV"><label>Voice</label><select id="${prefix}Voice">${opt(pr.voices,"v3")}</select></div><div class="hint" id="${prefix}SerV"></div>
   <label>Quality</label>${chips(prefix+"Takes",{"3":"Best of 3 takes","1":"Fast draft"},"3")}
   <label>Delivery — calm ↔ expressive</label>${range(prefix+"Ex",0.25,0.7,0.05,0.35)}
   <label>Pauses — shorter ↔ longer</label>${range(prefix+"Pause",0.4,1.6,0.05,1.0,"×")}
   <div>${sw(prefix+"Drama","Dramatic pauses — hold the silence after “लेकिन उसके बाद…”, before “तभी”, after a reveal",false)}</div>
   <div>${sw(prefix+"Emo","Emotions — the AI marks each line [डर] [उदास] [फुसफुसाहट] … and your voice follows (gently, no pitch jumps)",false)}</div>
   <div class="hint">Both are saved into the script, so you can edit them. Turning one on for an existing narration remakes all of it, not just a few lines.</div>
   <div class="sec">Music & sound</div>
   <div id="${prefix}SndBox" class="hidden">${chips(prefix+"Snd",{auto:"Auto: music + ambience + sound effects",music:"Music only (auto)",pick:"Choose a track",none:"No music"},"auto")}<div class="hint" id="${prefix}SndH"></div></div>
   <div class="row" id="${prefix}MusRow"><div>${musicSel(prefix+"Music")}</div><div style="flex:0"><button class="btn small" onclick="audition('${prefix}Music')">▶ Listen</button></div></div>
   <div id="${prefix}SukM">${(()=>{const A=P.presets.audio||{},S=A.shape;if(!S)return `<div class="hint">Build the music index in Settings to get “like my Sukoon episodes”.</div>`;
     return `<div style="margin-top:10px">${sw(prefix+"Shape","Like my Sukoon episodes",true)}</div><div class="hint">from ${S.from_episodes} of your episodes: starts ${S.lead_s} s before you, about ${Math.abs(S.story_db)} dB under your voice, keeps playing after you stop${A.auto?" · default track: "+esc(A.auto):""}</div>
     <label>Music after the story</label>${chips(prefix+"Tail",{"1min":"1 min","5min":"5 min","usual":"like my episodes (~"+Math.round(S.tail_s/60)+" min)"},prefix=="e"?"usual":"1min")}`})()}
   <label>Music under the voice by (when not “like my episodes”)</label>${range(prefix+"Db",8,24,1,P.presets.music_under_db||14," dB")}</div><div id="${prefix}SerM" class="hidden">${chips(prefix+"STail",{"1min":"1 min","5min":"5 min"},"1min")}<label>Music after the story</label>${chips(prefix+"STail",{"1min":"1 min","5min":"5 min"},"1min")}</div>
   <audio id="${prefix}Aud" class="hidden"></audio>`}
const SMUS={bhay:"Dark, Tension, Eerie",rahasya:"Tension, Dark",kisse:"Sad, Love, Calm",romanch:"Love, Calm",kareeb:"Calm",gyaan:"Calm, Happy"};
function voiceSeries(p,g){const d=SDEF[g]||SDEF.sukoon,suk=g=="sukoon";
  const mo=$(`#${p}Music option[value=""]`);if(mo){mo.dataset.suk=mo.dataset.suk||mo.textContent;mo.textContent=suk?mo.dataset.suk:`Auto — a fresh track from the ${serName(g)} mood folders (${SMUS[g]}), least used first`}
  $(`#${p}SukV`).classList.toggle("hidden",!suk);$(`#${p}SukM`).classList.toggle("hidden",!suk);$(`#${p}SerM`).classList.toggle("hidden",suk);
  $(`#${p}SerV`).textContent=suk?"":`Your ${serName(g)} voice (trained for this series, or your plain voice until it is trained) · its own pace and pauses`;
  $(`#${p}SndBox`).classList.toggle("hidden",suk);
  const snd=()=>{const m=chipVal(p+"Snd")||"auto";$(`#${p}MusRow`).classList.toggle("hidden",!suk&&m!="pick");
    $(`#${p}SndH`).textContent={auto:`The AI reads the story, picks ${serName(g)} music (${SMUS[g]}) and places ambience + sound effects scene by scene. The same plan is reused for pictures / video.`,
      music:`A fresh track from the ${serName(g)} mood folders under your voice.`,pick:"Your track under your voice.",none:"Only your voice."}[m]||""};
  if(!$(`#${p}Snd`).dataset.w){$(`#${p}Snd`).dataset.w=1;$(`#${p}Snd`).addEventListener("change",snd)}snd();
  setRange(p+"Ex",d.ex);setRange(p+"Pause",d.pause);if($(`#${p}Drama`))$(`#${p}Drama`).checked=!!d.drama;if($(`#${p}Emo`))$(`#${p}Emo`).checked=!!d.emo}
function voiceVals(p){return {voice:$(`#${p}Voice`).value,takes:+chipVal(p+"Takes"),exaggeration:+$(`#${p}Ex`).value,pause_scale:+$(`#${p}Pause`).value,music_track:$(`#${p}Music`).value,music_db:+$(`#${p}Db`).value,
  music_shape:$(`#${p}Shape`)?$(`#${p}Shape`).checked:false,tail:chipVal(p+"Tail")||"1min",
  dramatic:$(`#${p}Drama`)?$(`#${p}Drama`).checked:false,emotions:$(`#${p}Emo`)?$(`#${p}Emo`).checked:false}}
function audition(id){const v=$("#"+id).value,a=$("#"+id.replace("Music","Aud"));if(!v||v=="none"){a.pause();return toast("choose a track")}if(!a.paused&&a.dataset.f==v){a.pause();return}a.dataset.f=v;a.src=media(v);a.currentTime=20;a.play()}
R.voice=async(preN)=>{await loadLib();await pre();
  $("main").innerHTML=`<div class="simple"><h1>Voice</h1><p class="sub">Paste or drop a script — your voice reads it.</p>
  <div class="card">
   ${serBar("vSer",guessSer(preN))}
   <div class="row"><div><label>Name</label><input id="vName" type="text" placeholder="e.g. Sukoon 10.10"></div><div style="flex:0"><button class="btn" onclick="loadFile('vScript','vName')">Open .txt</button></div></div>
   <label id="vScriptL">Script</label><textarea id="vScript" placeholder="अब उस चाय के मग को...&#10;(...)&#10;बहुत प्यार से... अपने साइड में रख दीजिए।"></textarea>
   <div id="vTrBox" class="hidden actions"><button class="btn" id="vTr">Translate now to check it</button><span class="hint" id="vTrH">or just start — it translates first</span></div>
   <div id="vHiBox" class="hidden"><label>Hindi (edit before voicing)</label><textarea id="vHi" style="min-height:200px"></textarea></div>
   <div class="actions"><button class="btn primary" id="vGo">${svg("voice")} Read it in my voice</button><span class="hint" id="vCount"></span></div>
   <div id="vLangBox">${more("Language",`${chips("vLang",{hi:"Hindi script",en:"English → Hindi (AI translates)",nar:"English · the English narrator reads it"},"hi")}<div class="hint">One phrase per line · (...) long pause · ... soft ending · blank line = paragraph.</div>`)}</div>
   ${more("Voice & music",voiceForm("v"))}
   ${more("Try one line first",`<div class="row"><div><input id="pvLine" type="text" placeholder="a line to hear in ~1 minute"></div><div style="flex:0"><button class="btn" id="pvGo">Preview</button></div></div><div id="pvOut" class="hint"></div>`)}
   ${more("Fix phrases in a narration",`<select id="rNar">${narrOpts(preN)}</select><div class="row"><div><input id="rNums" type="text" placeholder="phrase numbers, e.g. 9, 18"></div><div style="flex:0;display:flex;gap:8px"><button class="btn" id="rGo">Remake</button><button class="btn small" id="rRep">Report</button></div></div><div class="hint" id="rOut"></div>`,!!preN)}
  </div></div>`;
  dropTxt("vScript","vName");
  const upd=()=>{const t=$("#vScript").value,w=t.split(/\s+/).filter(Boolean).length;$("#vCount").textContent=w?`${w} words · about ${Math.max(1,Math.round(w/190))} min of speech · ~${Math.max(1,Math.round(w/190*5.5))} min of PC time`:""};$("#vScript").oninput=upd;
  $("#vLang").addEventListener("change",()=>{const en=chipVal("vLang")=="en",nar=chipVal("vLang")=="nar";$("#vGo").lastChild.textContent=nar?" Let the English narrator read it":" Read it in my voice";$("#vTrBox").classList.toggle("hidden",!en);$("#vScriptL").textContent=en?"English script":"Script";if(!en)$("#vHiBox").classList.add("hidden")});
  $("#vTr").onclick=async e=>{const b=e.currentTarget;b.disabled=true;$("#vTrH").innerHTML='<span class="spin"></span> translating with '+esc(P.presets.llm)+' …';
    try{const r=await api("/api/translate",{text:$("#vScript").value});$("#vHi").value=r.text;$("#vHiBox").classList.remove("hidden");$("#vTrH").textContent="done — check the Hindi below"}catch(x){toast(x.message,1);$("#vTrH").textContent=""}b.disabled=false};
  const vser=()=>chipVal("vSer")||"sukoon";
  const vApply=()=>{const g=vser();store.set("toolSer",g);voiceSeries("v",g);$("#vLangBox").classList.toggle("hidden",g!="sukoon");$("#vName").placeholder=SPFX[g]+" - …"};
  $("#vSer").addEventListener("change",vApply);vApply();
  $("#vName").addEventListener("change",()=>{const g=guessSer($("#vName").value,vser());if(g!=vser()){setChip("vSer",g);vApply()}});
  $("#vGo").onclick=e=>{if(vser()!="sukoon"){const g=vser(),t=$("#vScript").value.trim();if(!t)return toast("Paste or open a script",1);
      const sm=chipVal("vSnd")||"auto";
      return startGo("genre",{genre:g,stages:sm=="none"?["script","voice"]:sm=="auto"?["script","voice","scenes","sound"]:["script","voice","sound"],name:$("#vName").value.trim(),script:t,
        takes:+chipVal("vTakes"),exaggeration:+$("#vEx").value,pause_scale:+$("#vPause").value,dramatic:$("#vDrama").checked,emotions:$("#vEmo").checked,
        music_track:chipVal("vSnd")=="pick"&&$("#vMusic").value!="none"?$("#vMusic").value:"",tail:chipVal("vSTail")||"1min"},e.currentTarget)}
    const en=chipVal("vLang")=="en",hi=$("#vHi").value.trim();const useHi=en&&hi&&!$("#vHiBox").classList.contains("hidden");
    const nar=chipVal("vLang")=="nar";
    startGo("voice",{name:$("#vName").value,script:useHi?hi:$("#vScript").value,lang:en&&!useHi?"en":"hi",language:nar?"en":"hi",...voiceVals("v")},e.currentTarget)};
  $("#pvGo").onclick=async e=>{const l=$("#pvLine").value.trim();if(!l)return toast("write a line",1);const id=await start("voice",{script:l,preview:true,...voiceVals("v")},e.currentTarget);if(id){P.preview=id;$("#pvOut").innerHTML='<span class="spin"></span> making the preview (waits if a job is running)…'}};
  if($("#rNar"))$("#rNar").insertAdjacentHTML("afterend",`<div class="actions"><button class="btn small" onclick='go("fix",$("#rNar").value)'>Open the phrase list (listen + tick)</button></div>`);
  $("#rGo").onclick=e=>{const d=$("#rNar").value;if(!d)return toast("choose a narration",1);if(!$("#rNums").value.trim())return toast("which phrase numbers?",1);startGo("voice",{name:base(d),redo:$("#rNums").value,...voiceVals("v")},e.currentTarget)};
  $("#rRep").onclick=async()=>{const d=$("#rNar").value;if(!d)return;try{const t=await (await fetch(media(join(d,"report.txt")))).text();$("#rOut").innerHTML=`<pre style="white-space:pre-wrap;margin:8px 0 0">${esc(t)}</pre>`}catch(e){}};
};
async function checkPreview(jobs){if(!P.preview)return;const j=jobs.find(x=>x.id==P.preview);if(!j||!["done","failed","stopped"].includes(j.status))return;
  const el=$("#pvOut");P.preview=null;if(!el)return;if(j.status!="done"){el.textContent="the preview did not work — see Jobs & logs";return}
  el.innerHTML=`<audio controls autoplay src="${media(join(j.outputs[0],"narration.wav"))}"></audio>`}

// ---------------- PICTURES (from a narration)
function imgOpts(p,size="16:9"){const pr=P.presets;return `
   <label>Look</label>${chips(p+"Style",pr.styles,store.get(p+"style",pr.styles.sukoon_theme?"sukoon_theme":"sukoon_night"))}
   <label>Size</label>${chips(p+"Size",pr.sizes,size)}`}
function imgAdv(p){const pr=P.presets;return more("Model & quality",`
   <div class="row"><div><label>Model</label><select id="${p}Eng">${pr.engines.map(e=>`<option>${e}</option>`).join("")}</select></div><div><label>Quality steps</label>${range(p+"Steps",4,30,1,8)}</div><div><label>Seed</label><input id="${p}Seed" type="number" placeholder="random"></div></div>
   <label>Avoid (used by DreamShaper; Z-Image ignores it)</label><input id="${p}Neg" type="text" placeholder="text, watermark, blurry, extra people">`)}
const imgVals=p=>{store.set(p+"style",chipVal(p+"Style"));return {style:chipVal(p+"Style"),size:chipVal(p+"Size"),engine:$(`#${p}Eng`).value,steps:+$(`#${p}Steps`).value,seed:$(`#${p}Seed`).value,negative:$(`#${p}Neg`).value}};
R.pics=async(preN)=>{await loadLib();await pre();
  $("main").innerHTML=`<div class="simple"><h1>Pictures for a voice</h1><p class="sub">The AI reads the story part by part and paints one picture for each.</p>
  <div class="card">
   <label>Narration</label><select id="pNar">${narrOpts(preN)}</select>
   ${serBar("pSer",guessSer(preN))}<div class="hint" id="pSerH"></div>

    $$("main .card details.more").forEach(d=>d.style.display=suk?"":"none");["pStyle","pSize"].forEach(i=>{const x=$("#"+i);x.style.display=x.previousElementSibling.style.display=suk?"":"none"});if(!suk&&+$("#pN").value==6)$("#pN").value=0};

R.image=async(varOf)=>{await loadLib();await pre();
  $("main").innerHTML=`<div class="simple"><h1>Image</h1><p class="sub">Describe it — it gets painted.</p>
  <div class="card">
   <label style="margin-top:0">Main subject</label>
   <textarea id="iPrompt" style="min-height:96px" placeholder="an old man reading a letter under a street lamp"></textarea>

   <label>Inspired by</label>
   <div class="row" style="align-items:center"><div id="iRefBox"><button class="btn" onclick="pickRef()">Pick one of my thumbnails</button> <span class="hint">${P.presets.index.count?P.presets.index.count+" indexed":"index them once in Settings"}</span></div></div>
   <div id="iRefClose" class="hidden"><label>How close to it</label>${range("iDen",0.45,0.9,0.05,0.7)}<div class="hint">left = keeps its layout and colours closely · right = only its colours and light</div></div>
   ${imgOpts("i")}
   <div class="actions"><button class="btn primary" id="iGo">${svg("image")} Paint</button><span class="hint">2 pictures</span></div>
   ${more("More",`<div class="row"><div><label>How many</label><input id="iN" type="number" min="1" max="8" value="2"></div></div><div style="margin-top:10px">${sw("iBatch","one prompt per line (batch)")}</div><label>Add your own pictures</label><div class="drop" id="iDrop">Drop pictures here or click</div>`)}
   ${imgAdv("i")}
  </div>
  <h2>Recent</h2><div class="thumbs" id="iGal"></div></div>`;
  $("#iGal").innerHTML=(P.lib.images||[]).map(f=>thumbAct(f,["View","Variations","Use as artwork"])).join("")||'<div class="empty">No pictures yet.</div>';
  dropImg($("#iDrop"),()=>R.image());
  $("#iGo").onclick=e=>startGo("image",{prompt:$("#iPrompt").value,batch:$("#iBatch").checked,count:+$("#iN").value,silhouette:$("#iSil").checked,
     ref:P.ref||"",denoise:P.ref?+$("#iDen").value:null,...imgVals("i")},e.currentTarget);
  showRef();
};
function thumbAct(f,acts,extra=""){const F=esc(JSON.stringify(f));return `<div class="thumb" ${extra}><img loading="lazy" src="${media(f)}" onclick='showImg(${F})'><div class="acts">${acts.map(a=>`<button onclick='act(${JSON.stringify(a)},${F},this)'>${a}</button>`).join("")}</div></div>`}
async function act(a,f,el){if(a=="Remove")return removeItem(f,"picture "+base(f));
  if(a=="View")return showImg(f);
  if(a=="Variations"){const n=prompt("How many variations?","4");if(!n)return;return startGo("image",{variations_of:f,count:+n,size:sizeOf(el)})}
  if(a=="Use as artwork"){P.sel.sArt=f;go("video");return}
  if(a=="Repaint"){const set=el.closest("[data-set]").dataset.set;const p=(await promptOf(f)).split("\n\n")[0];
    modal(`<h2 style="margin-top:0">Repaint ${esc(base(f))}</h2><img src="${media(f)}"><label>Prompt (change it, or keep it for just a new seed)</label><textarea id="rpP" style="min-height:120px">${esc(p)}</textarea>
     <div class="actions"><button class="btn primary" id="rpGo">Repaint</button><button class="btn" onclick="closeModal()">Cancel</button><span class="hint">the old picture is kept as _old_…</span></div>`);
    $("#rpGo").onclick=async e=>{await start("repaint",{set,file:base(f),prompt:$("#rpP").value},e.currentTarget);closeModal()}}}
function sizeOf(el){const i=el.closest(".thumb").querySelector("img");if(!i.naturalWidth)return "16:9";const r=i.naturalWidth/i.naturalHeight;return r>1.4?"16:9":r<0.65?"9:16":r<0.9?"4:5":"1:1"}
function pickRef(){const T=P.presets.index.thumbs||[];if(!T.length)return toast("index your thumbnails first (Settings)",1);
  const grp=s=>T.filter(t=>t.series==s).map(t=>`<div class="thumb" onclick='setRef(${esc(JSON.stringify(t.file))})' title="${esc(t.look)}"><img loading="lazy" src="${media(t.thumb)}"><span>${esc(t.name).slice(0,24)}</span></div>`).join("");
  modal(`<h2 style="margin-top:0">Inspired by…</h2><p class="hint">The new picture keeps this one's colours, light and feel; your subject replaces its subject.</p>
   <div class="sec">Sukoon</div><div class="thumbs">${grp("sukoon")||'<div class="empty">none</div>'}</div><div class="sec">Kisse</div><div class="thumbs">${grp("kisse")||'<div class="empty">none</div>'}</div>
   <div class="actions"><button class="btn" onclick="setRef('')">No reference</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function setRef(f){P.ref=f;closeModal();showRef()}
function showRef(){const b=$("#iRefBox");if(!b)return;const t=(P.presets.index.thumbs||[]).find(x=>x.file==P.ref);
  $("#iRefClose").classList.toggle("hidden",!t);
  b.innerHTML=t?`<div style="display:flex;gap:12px;align-items:center"><img src="${media(t.thumb)}" style="width:150px;border-radius:8px"><div><b>${esc(t.name)}</b><div class="hint">${esc(t.look).slice(0,140)}…</div><div style="margin-top:6px"><button class="btn small" onclick="pickRef()">Change</button> <button class="btn small" onclick="setRef('')">Remove</button></div></div></div>`
   :`<button class="btn" onclick="pickRef()">Pick one of my thumbnails</button> <span class="hint">${P.presets.index.count?P.presets.index.count+" indexed":"index them once in Settings"}</span>`}
async function showImg(f){lightbox(media(f),await promptOf(f))}

R.video=async(preN)=>{await loadLib();await pre();const L=P.lib,pr=P.presets,tab=store.get("vtab","st");
  $("main").innerHTML=`<h1>Video</h1><p class="sub">Choose the series: सुकून = one picture → a calm video with reels (or a slideshow). Any other series = its own video: scenes that follow the story, camera moves, light, sound effects, subtitles.</p>
  <div class="simple" style="margin:0 0 14px"><div class="card">${serBar("wSer",guessSer(preN))}</div></div>
  <div id="wSerBox" class="simple hidden" style="margin:0"><div class="card">
   <label>Narration</label><select id="wNar">${narrOpts(preN)}</select>

   <div class="row"><div style="flex:0 0 130px"><label>Reels (9:16)</label><input id="wReels" type="number" min="0" max="6" value="2"></div><div style="flex:0 0 150px"><label>Reel length (s)</label><input id="wReelLen" type="number" min="15" max="60" value="30"></div></div>

// ---------------- TINKER: Experimental-only settings (app/tinker.py), with install into Working mode
const TK={tab:store.get("tktab","models"),d:null};
const tkSame=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const tkName=(s,k)=>s=="models"?((TK.d.models.find(m=>m.key==k)||{}).label||k):s=="prompts"?((TK.d.prompts.find(p=>p.key==k)||{}).label||k):s=="tables"?k:"Writing rules · "+k;
function tkPending(){const d=TK.d,o=[];
 d.models.forEach(m=>{if(m.experimental&&m.experimental!=m.working)o.push(["models",m.key,m.working+" → "+m.experimental])});
 d.prompts.forEach(p=>{if(p.experimental!=null&&p.experimental!=p.working)o.push(["prompts",p.key,"edited prompt"])});
 d.tables.forEach(t=>{if(t.experimental&&!tkSame(t.effective,t.working))o.push(["tables",t.key,"changed: "+Object.keys(t.experimental).join(", ")])});
 d.genre_rules.forEach(g=>{if(g.differs)o.push(["genre_rules",g.key,"edited rules"])});return o}
async function tkSave(section,key,value,quiet){try{await api("/api/tinker/save",{section,key,value});if(!quiet)toast(value==null?"Back to the Working value":"Saved for Experimental runs");await R.tinker()}catch(e){toast(e.message,1)}}
async function tkInstall(items){const list=items=="all"?tkPending().map(x=>({section:x[0],key:x[1]})):items;if(!list.length)return toast("Nothing to install: Experimental matches Working",1);
 if(!confirm("Install into Working mode?\n\n"+list.map(i=>"• "+tkName(i.section,i.key)).join("\n")+"\n\nEach changed file is backed up first (…_old_<time>)."))return;
 try{const r=await api("/api/tinker/promote",{items:list});toast("Installed "+r.items.length+" change(s) into Working mode");await R.tinker()}catch(e){toast(e.message,1)}}
async function tkWorkingReset(section,key){if(!confirm("Put Working mode back to the value written in the code for "+tkName(section,key)+"?\nA backup is made first."))return;
 try{await api("/api/tinker/working_reset",{section,key});toast("Working mode uses the code's value again");await R.tinker()}catch(e){toast(e.message,1)}}
function tkJson(id){try{return JSON.parse($("#"+id).value)}catch(e){toast("Not valid JSON: "+e.message,1);return undefined}}
R.tinker=async()=>{let d;try{d=TK.d=await api("/api/tinker")}catch(e){$("main").innerHTML='<div class="simple"><h1>Tinker</h1><div class="card">Could not load settings: '+esc(e.message)+'. Restart the hub after updating it.</div></div>';return}
 const pend=tkPending(),tabs={models:"Models",prompts:"Prompts",tables:"Series settings",rules:"Writing rules",history:"Installed"};
 let body="";

R.help=()=>{const S=(t,b)=>`<h2>${t}</h2><div class="card help">${b}</div>`;
  $("main").innerHTML=`<div class="simple"><h1>How to use the hub</h1><p class="sub">Everything runs on this PC. One graphics-card job at a time; script writing, element fetching and checks run beside it. Nothing is ever deleted – old files go to <b>_old</b>.</p>
  ${S("Make a whole Sukoon episode",`<ol>
   <li><b>Create → Sukoon episode.</b> Give it a name.</li>
   <li><b>Script:</b> choose <b>I have a script</b> (paste, Open .txt, or pick one – ✎ new · 🎙 voice made · ✓ episode made) – you see the speech time in your own voice. Or choose <b>Let the AI write it</b>: pick a kind of episode, type a topic or press <b>3 fresh ideas</b> and click one. <i>Only write scripts</i> writes several to choose from later.</li>
   <li><b>Video length:</b> e.g. 30 min. If the speech is longer, the AI shortens the script and keeps the story (the full script is kept).</li>
   <li>Optional: <b>Artwork</b> (style, your idea, or your own picture), <b>Voice, music & typography</b>, <b>Title, reels & language</b>.</li>
   <li><b>Make the whole episode</b> → follow it in <b>Activity</b>. Result: <code>D:\\MukhtalifGPT\\Series\\&lt;series&gt;\\Episodes\\&lt;name&gt;\\Output</code> + 3 reels.</li></ol>`)}
  ${S("Reels from a finished episode",`<b>Create → Reels</b>: pick the episode, choose <b>New moments</b> (not used before), <b>Best moments</b>, or <b>At times I choose</b> (e.g. <code>2:03, 5:16</code>), the length (20–60 s) and a <b>camera motion</b> (watch the previews, or Mix). Old reels are never overwritten.`)}
  ${S("Something looks or sounds wrong → Repair",`<b>Create → Repair</b>: pick a video or reel → <b>Check it</b>. You get the voice lines with stutters / wrong words (▶ plays that moment), the subtitle rhythm, and any jumps, freezes or loop pops. Tick what to fix → <b>Repair what is ticked</b>. Only the ticked lines are re-spoken; the music and video are made again; the old file goes to <code>_old</code>. New reels and videos are already checked automatically after they are made.`)}
  ${S("The other Create pages",`<b>Voice</b> – your voice reads any script (best takes, calm ↔ expressive, pauses, music, “Fix phrases”). <b>Pictures</b> – paintings that follow a narration. <b>Video</b> – a Sukoon video from a voice and one or more pictures (typography, fonts, captions). <b>Image</b> – any picture from words, or inspired by one of your thumbnails.`)}
  ${S("Review faster: playback speed",`Every voice, music and video player has a <b>Speed</b> row: <b>1×</b>, <b>1.5×</b>, <b>2×</b>, <b>3×</b> or <b>…</b> for your own (0.25 to 4). One speed is used by all players, voices keep their natural pitch, and the speed is remembered in this browser. Keys <b>&lt;</b> and <b>&gt;</b> step it down / up (not while typing). Above 2× fast speech can sound a little choppy; over 4× browsers mute the sound. Speed only changes playback, never the saved files.`)}
  ${S("Experimental mode in one minute",`<ul><li>This is the <b>Experimental</b> copy of the hub. Runs made here use the Experimental settings from <b>Tinker</b>; Working mode stays as it is until you install a change.</li>
   <li>Each Experimental run keeps the settings it started with, so changing Tinker in the middle of a job does not affect that job.</li>
   <li>Press <b>Working mode</b> in the sidebar to go back to the normal hub.</li></ul>`)}
  ${S("Genre episodes in Experimental (Bhay, Kisse, Rahasya …)",`<ol>
   <li><b>Script</b>: the local model <code>gemma4:26b-a4b-it-qat</code> writes it (it thinks before answering, so this takes a few minutes). Leave the name empty and the episode is named from the story's English title, for example <code>Kisse-Clink-Steel-Tiffin</code>. A name you type always wins.</li>
   <li><b>Emotion marks</b>: the AI marks the feeling of each line, 15 lines at a time.</li>
   <li><b>Scenes</b>: a new scene starts where a sentence ends, about every 30 s (<b>Tinker → Models → Scene length</b>). The director (<code>gemma4:12b-it-qat</code>) writes one line per scene saying <i>what happens</i>, then turns it into the picture prompt. Rain, candles, mirrors and other things the story never names are rewritten or cut. Prompts say what to paint, never “no …”, because the painter ignores “no”.</li>
   <li><b>Picture check</b>: <code>gemma3:12b</code> looks at every picture and answers simple questions (what is the main subject, how many people, any words in it …). The code decides pass or fail. A wrong picture gets a new prompt and is painted again, at most twice. If it is still wrong, the best version is kept and <b>flagged</b> on the Ratings page, and the video is still made.</li>
   <li><b>Ending</b>: with <b>Whole video 0</b> the music plays 10 s after the voice. The picture fades into a soft blurred copy in the series colour, the SUBSCRIBE button is clicked and the bell rings. Change it in <b>Tinker → Models</b>: <i>Ending after the voice</i> and <i>Subscribe + bell animation</i>. Reels and Sukoon have no bell.</li>
   <li><b>Sound</b> (Bhay, Rahasya, Kisse, Romanch): the AI marks how heavy each part is (the <i>emotion map</i>). The music comes from the folder of the story's mood, sits 18 dB under your voice, rises a little in pauses, goes quiet before a heavy line and can change track up to 3 times (never back). See the next section.</li>
   <li><b>Make it again</b>: on the <b>Video</b> page, switch on <b>Plan the scenes and paint the pictures again</b>. The old scenes and video are moved to <code>_old_&lt;time&gt;</code>, never deleted.</li>
   <li>Everything is saved in <code>D:\\MukhtalifGPT\\Series\\&lt;series&gt;\\Episodes\\&lt;name&gt;</code>. The graphics card is freed between steps, and every AI model is unloaded before the voice and the painter start.</li></ol>`)}
  ${S("Music, ambience and effects in genre episodes",`<ul><li><b>Music</b>: the folder is chosen from the story's mood (for example Sad), not from the biggest folder. Inside it your ratings come first, then the track used least <i>in this series</i>; a track from the series' last 3 episodes is skipped while another fits. Default level: 18 dB under the voice (Create form slider, 8–24).</li>
   <li><b>Following the emotion</b> (Bhay, Rahasya, Kisse, Romanch): a light line dips the music, a heavier one gets a short silence before it, the heaviest (a death, the final twist) stops music, ambience and effects for 2–3 s and then plays one soft low note. Up to 3 tracks per story, a change only for a mood that lasts 90 s, never back to an earlier track. The job log lists the tracks and the turns. Change it in <b>Tinker → Series settings → emotion_music.SERIES</b>. Gyaan, Kareeb and Sukoon keep one track.</li>
   <li><b>Ambience</b>: one bed per place that keeps playing across scenes (crossfade when the place changes), at most 3 per story, none while a character is only thinking, a short break after 2½ min. A bed whose name says a sound the scene does not have (a train, a market…) is left out, so a scene may have music only.</li>
   <li><b>Effects</b>: everyday sounds (knock, door, footsteps, phone, paper…) can be used by every series; mood sounds (whisper, scream, braam, riser…) only by the series that list them. After the plan, the AI is asked once more just for the sounds that really happen, with the exact words; each must be in the series' list and its words must be in that part of the story.</li>
   <li><b>Not proven yet</b>: one real Kisse run so far (Blue Ink Diary). It had music only: no ambience bed and no effects were placed. The fixes for that need a hub restart. What is proven and what is not: <code>CHANGELOG.md</code> in the hub folder.</li></ul>`)}
  ${S("Tinker: try other models and prompts",`<ul><li><b>Models</b>: pick the script writer, scene director, scene picture prompts, prompt model, vision model, image engine, scene length and the ending. Type a name or choose from the list (Ollama models on this PC show up).</li>
   <li><b>Prompts</b>: the long instructions the AI gets for scripts, scenes and checks. Edit, then <b>Save for Experimental</b>. Keep the words in <code>{braces}</code>; the code fills them in.</li>
   <li><b>Series settings</b> and <b>Writing rules</b>: per-series tables (music moods, effects, pacing) and the rules for each series' scripts.</li>
   <li><b>Install into Working</b>: the box at the top lists everything that differs from Working mode. Tick what worked and press <b>Install selected into Working</b>. Each file is backed up first (<code>…_old_&lt;time&gt;</code>), no restart needed. Not possible while a job is running.</li>
   <li><b>Installed</b> tab: what was installed when, with its backups. To undo, copy a backup over the file and restart the hub.</li></ul>`)}
  ${S("Rate what you make: Review and Ratings",`<ul><li><b>Library → Review</b> on any video: rate it very bad … very good, and its parts (script, voice, music, effects, effect timing, pictures, subtitles). ✎ adds a note.</li>
   <li>Every sound-effect cue can be marked <b>on time / too early / too late / wrong sound / not needed</b>.</li>
   <li>Music and effect files are rated on the <b>Sounds</b> page. Rated bad means they are no longer picked; rated good means they come up more often.</li>
   <li>The <b>Ratings</b> page shows the average per series, weak spots with buttons into Tinker, <b>Ask the AI…</b> to rewrite a prompt from your notes (you check it before saving), versions compared, and how close the AI's ratings are to yours.</li></ul>`)}
  ${S("AI self-review",`<ul><li>Runs by itself after each Experimental video, or press <b>Run AI self-review</b> on the Review page.</li>
   <li>Whisper listens to the narration: does each effect land on the right word, does the voice match the script, are subtitles in sync, and how clearly the voice stands above music and effects (hardest-to-hear moments are listed).</li>
   <li>The vision model rates the pictures, the story model rates the script and whether each effect makes sense.</li>
   <li>Its ratings show as <b>AI</b> until you change them. Your rating always wins.</li></ul>`)}
  ${S("Sound effects on the spoken word",`Experimental runs place each effect where Whisper hears its word (for example the knock lands on “दस्तक”), instead of guessing from the word count. If one is still off, mark it too early / too late on the Review page.`)}
  ${S("Sounds page: music and effects",`<ul><li><b>Music</b> and <b>Effects</b> tabs: every file with its licence, how often it was used, its rating and a <b>speech check</b> badge.</li>
   <li><b>Speech check</b>: music that fills the voice range (300 Hz–3 kHz) or effects with piercing highs (bird chirps, whistles) are <b>softened</b> when used or <b>never used</b> when too strong. Hover the badge to see why; the menu next to it lets you overrule it.</li>
   <li><b>Settings &gt; Your music &gt; Build / update</b> measures every file that has not been checked yet: speech band, piercing highs, beat and brightness, and which mood folders each track really sounds like.</li>
   <li><b>Get more</b>: search Openverse (no key) or Freesound (free key, add it in Settings). Only CC0 / public domain is downloaded; tick the switch to also allow CC BY (a <code>credits.txt</code> is written for the video description). Non-commercial and no-derivatives sounds are never offered.</li>
   <li><b>More music for a series</b> / <b>More effects for a series</b>: fetch a few files for each mood or effect kind a series uses. Each download is speech-checked before it is kept.</li>
   <li><b>Import</b>: add your own files with their licence. <b>Licences</b>: record where older files came from. YouTube Audio Library cannot be downloaded automatically; download by hand, then Import.</li></ul>`)}
  ${S("Export for training",`<b>Ratings → Export now</b> writes JSONL files: rated scripts, good-vs-bad script pairs, picture prompts with ratings and judged effect placements. AI ratings are marked <code>rated_by = ai</code>. The folder opens when it is done.`)}
  ${S("Corner narrator",`<ul><li><b>Narrator</b> in the sidebar: upload a transparent PNG of a half upper body (facing you, mouth closed), mark it male or female and tick its series. Or paint original ones with ComfyUI for the chosen series (green background, cut out automatically).</li><li>The hub guesses the mouth and eye points; click the picture to correct them. Optional: a mouth-open and an eyes-closed picture of the same size for smoother lips and blinks.</li><li>Per series: on/off, which narrator, corner, size and margin – separately for the 16:9 video and the 9:16 reels – with a live preview on a frame of your newest video. The yellow box shows the subtitles; with a bottom corner, genre subtitles are kept narrower so they do not run under the narrator.</li><li>Each run: Create page → <b>Corner narrator</b>: series setting / on / off / another narrator.</li><li>The lips follow the clean narration (Whisper word times when the run has them) and its loudness; the narrator breathes and blinks. The clean video stays in <code>Output\\_clean</code>; <b>Add the narrator to a finished video</b> redoes it without a new render.</li><li>Working mode gets it only when you install <b>narrator.SERIES</b> on the Tinker page.</li></ul>`)}
  ${S("Thumbnails",`<ul><li><b>Thumbnails</b> in the sidebar: a 1920×1080 YouTube thumbnail per episode, saved as <code>&lt;episode&gt;_thumbnail.jpg</code> in the episode folder (next to the video folder).</li><li>Per series: layout (title bottom / left / right / middle), which picture (first, best checked, first close-up), colour grade, letters, size, title / accent / outline colours, outline, glow, shade behind the words, dark corners, a small line above the title, the series badge, and the channel logo and name (they come from Tinker → tools.CHANNEL, Bhay = Haunted Gatha). <b>Save for …</b> keeps it (Tinker table thumbnail.SERIES).</li><li>Per episode: click one of its pictures and type other title words; that is kept for that episode only. A title with ':' is split into a big line and a smaller second line.</li><li>Experimental genre runs make the thumbnail by themselves right after the video when 'Make one after every … video' is on. <b>Make for episodes without one</b> does the older episodes in one go.</li></ul>`)}
  ${S("Save / Git: keep versions of the code",`<ul><li><b>Save / Git</b> in the sidebar shows which code files changed. Tick the files to keep, write a short message, press <b>Commit ticked files</b>.</li>
   <li>Secrets, models, media, backups and big files are never offered; the list underneath says why each was skipped.</li>
   <li><b>Diff summary</b>, <b>Log</b> and the <b>diff</b> link per file show what changed. The exact git command and its output appear under <b>Output</b>.</li>
   <li><b>Push</b> sends commits to GitHub once you set the repository address under <b>Remote</b>. <b>Pull</b> brings changes in (not while a job runs); restart the hub afterwards.</li>
   <li>Set your name and e-mail once under <b>Who commits</b>.</li></ul>`)}
  ${S("Settings you set once",`<ul><li><b>Gemini key</b> (Google AI Studio) – fast, better Hindi scripts. Without it the local model writes.</li>
   <li><b>Pixabay key</b> – the hub fetches missing moving elements (steam, candles, rain …) in the background: only free-for-commercial-use, no credit, each clip in <code>ELEMENTS_INDEX.csv</code> with its source and where it is used.</li>
   <li><b>Your music</b> – Build / update once (the music shape of your episodes). <b>Thumbnail style guide</b> – Build / update once.</li>
   <li><b>Topic bank</b> – add your own topics, images, places. <b>Ledger</b> – every script written (so nothing repeats).</li></ul>`)}
  ${S("Good to know",`<ul><li>A word your voice says wrong: add it to <code>engines\\voice\\say_as.json</code> with a respelling – the captions keep the real spelling.</li>
   <li>After an update: <b>restart_hub.bat</b> (it asks if a job is running), then reload this page (F5).</li>
   <li>Each step in Activity shows how long it took.</li>
   <li>What changed and what was tested: <code>CHANGELOG.md</code>. What is still wrong: <code>KNOWN_PROBLEMS.md</code>. Where everything is: <code>PROJECT_MAP.md</code> (all in the hub folder).</li>
   <li>Full details: <code>README.txt</code> in the hub folder; for the next developer: <code>HANDOFF_HUB.txt</code>.</li></ul>`)}
  </div>`};

 try{const r=act=="log"||act=="diff"?await api("/api/git/"+act+(body&&body.file?"?file="+encodeURIComponent(body.file):"")):await api("/api/git/"+act,body||{});gtOut(r);if(!["log","diff"].includes(act)){toast(r.rc?"git "+act+" reported a problem – see the output":"Done: git "+act,!!r.rc);if(act=="commit"&&!r.rc&&$("#gtMsg"))$("#gtMsg").value="";await R.git(1)}}
 catch(e){toast(e.message,1);gtOut({out:"Not run: "+e.message})}finally{$$(".gtb").forEach(b=>b.disabled=false)}}

 $("main").innerHTML=head+
 '<div class="card"><div class="row"><div><b>Branch</b> '+esc(d.branch||"–")+(d.ahead?' · <span class="badge running">'+d.ahead+' to push</span>':'')+(d.behind?' · <span class="badge failed">'+d.behind+' to pull</span>':'')+'<div class="hint">'+esc(d.root)+' · remote: '+(hasRemote?esc(d.remote.join(", ")):"none set")+'</div></div></div>'+
 '<div class="actions"><button class="btn gtb" onclick="R.git()">Refresh</button><button class="btn gtb" onclick="gtDo(\'diff\')">Diff summary</button><button class="btn gtb" onclick="gtDo(\'log\')">Log</button>'+

// ---------------- REPAIR
R.repair=async()=>{await loadLib();const V=(P.lib.videos||[]).filter(v=>(v.kind=="episode"||v.kind=="reel")&&!/_preview|_motions/.test(v.file));
  $("main").innerHTML=`<div class="simple"><h1>Repair</h1><p class="sub">The repair man looks at a finished video or reel, lists what is wrong, and fixes what you tick. The old one is always kept.</p>
  <div class="card"><label>Video or reel</label><select id="xVid">${V.map(v=>`<option value="${esc(v.file)}">${v.kind=="reel"?"📱 ":"🎬 "}${esc(base(v.file))} · ${ago(v.time)}</option>`).join("")||'<option value="">no videos yet</option>'}</select>
   <div class="actions"><button class="btn primary" id="xCheck">Check it</button><span class="hint" id="xState"></span></div>
   <div id="xRep"></div></div></div>`;
  const ts=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
  const play=(f,t)=>`<a href="#" onclick="lightbox('${media(f)}#t=${Math.max(0,t-2)}','',1);return false">▶ ${ts(t)}</a>`;
  const show=async()=>{const v=$("#xVid").value;if(!v)return;const r=await api("/api/repair/report",{video:v}).catch(()=>({}));
    if(!r.checked){$("#xRep").innerHTML=`<div class="hint" style="margin-top:10px">Not checked yet.</div>`;return false}
    const reel=r.parts&&r.parts.is_reel,vo=r.voice||[],mo=r.motion||[],su=r.subtitles||{};
    $("#xState").textContent="checked "+r.checked;
    if(r.auto&&!reel){$("#xRep").innerHTML=`<div class="hint" style="margin-top:10px">Only the motion was checked automatically when the video was made (${(r.motion||[]).length?(r.motion.length+" place(s)"):"smooth"}). Press <b>Check it</b> for voice + subtitles too.</div>`;return true}
    $("#xRep").innerHTML=(reel?"":`<h2>Voice ${vo.length?`· ${vo.length} line(s)`:"· all fine"}</h2>${vo.map(x=>`<label class="chkrow"><input type="checkbox" class="xLine" value="${x.line}" checked><span><b>line ${x.line}</b> ${esc(x.text)} <span class="hint">— ${esc(x.why.join(", "))}</span> ${play(v,x.at)}</span></label>`).join("")}
      <div class="hint">Another line sounds wrong? <a href="#" onclick='go("fix",((P.lib.episodes||[]).find(e=>e.video==${esc(JSON.stringify(v))})||{}).narration||"");return false'>Open all phrases (listen + tick any line)</a></div>
      <h2>Subtitles</h2><div class="hint">${su.count||0} on-screen lines · ${esc(su.note||"")}${su.mean_gap_s?` · about every ${su.mean_gap_s} s`:""}</div>${sw("xSubs","Choose them again: split by meaning, timed by the content",!!su.even)}`)+
      `<h2>Motion ${mo.length?`· ${mo.length} place(s)`:"· smooth"}</h2>${mo.map(x=>`<div class="item" style="padding:4px 0"><span>${esc(x.kind)}</span> <span class="hint">${esc(x.why)}</span> ${play(v,x.at)}</div>`).join("")}
      ${reel?sw("xRemake","Make this reel again (same moment)",mo.length>0):sw("xLoop","Make the living artwork loop again (for loop pops)",mo.some(x=>x.kind=="loop pop"))}
      ${reel?"":sw("xQuick","Quick fix for voice lines: the new lines go into the same places, the picture is kept - only the sound is new (a few minutes instead of a whole render)",true)}
      <div class="actions"><button class="btn primary" id="xFix">Repair what is ticked</button><span class="hint">${reel?"":"subtitles / loop ticked → the video is drawn again; your reels stay"}</span></div>`;
    $("#xFix").onclick=e=>{const lines=$$(".xLine").filter(c=>c.checked).map(c=>+c.value);
      if(reel){if(!$("#xRemake").checked)return toast("Nothing ticked",1);return startGo("repair",{video:v},e.currentTarget)}
      const subs=$("#xSubs").checked,loop=$("#xLoop").checked;
      if(!lines.length&&!subs&&!loop&&!mo.length)return toast("Nothing ticked",1);
      store.set("xVid",v);startGo("repair",{video:v,voice_lines:lines,subtitles:subs,motion:loop,quick:$("#xQuick").checked},e.currentTarget)};return true};
  const want=P.pick||store.get("xVid","");if(want&&[...$("#xVid").options].some(o=>o.value==want)){$("#xVid").value=want}P.pick=null;
  const running=()=>(JOBS||[]).find(j=>["queued","running"].includes(j.status)&&/^(Check|Repair)/.test(j.title)&&j.title.includes(base($("#xVid").value)));
  let poll;const watch=()=>{const v=$("#xVid").value;clearInterval(poll);const j=running();if(!j)return;
    $("#xState").innerHTML=`<span class="spin"></span> ${esc(j.title.split(":")[0].toLowerCase())} is ${j.status=="queued"?"waiting its turn":"running"} — results appear here`;
    poll=setInterval(async()=>{if(!$("#xVid")||$("#xVid").value!=v){clearInterval(poll);return}if(!running()){clearInterval(poll);$("#xState").textContent="";show()}},3000)};
  $("#xVid").onchange=()=>{store.set("xVid",$("#xVid").value);$("#xState").textContent="";show().then(watch)};show().then(watch);
  $("#xCheck").onclick=async e=>{const v=$("#xVid").value;if(!v)return;const before=(await api("/api/repair/report",{video:v}).catch(()=>({}))).checked;
    store.set("xVid",v);await start("check_video",{video:v},e.currentTarget);$("#xState").textContent="checking… (a 30-min video takes a few minutes) - you can leave this page, the result waits here";clearInterval(poll);
    poll=setInterval(async()=>{if(!$("#xVid")){clearInterval(poll);return}const r=await api("/api/repair/report",{video:v}).catch(()=>({}));if(r.checked&&r.checked!==before){clearInterval(poll);show()}},4000)};
};

// ---------------- FIX (phrases of one narration: listen, tick, remake - no numbers to type)
R.fix=async(dir)=>{dir=dir||store.get("fixDir","");store.set("fixDir",dir);
  const r=await api("/api/narration/lines",{dir}).catch(e=>({lines:[],err:e.message}));const L=r.lines||[],bad=L.filter(x=>x.why.length);
  $("main").innerHTML=`<div class="simple"><h1>Fix: ${esc(base(dir))}</h1><p class="sub">Listen, tick the phrases that sound wrong, press <b>Remake</b>. Only those phrases are spoken again${r.video?" and put back into the video in the same places (the picture is kept)":""}. The old voice is always kept.</p>
  <div class="card">${r.audio?`<audio id="fxAud" controls preload="metadata" src="${media(r.audio)}" style="width:100%"></audio>`:""}
   <div class="row" style="align-items:center;margin-top:8px"><div class="hint" style="flex:1">${L.length} phrases · ${bad.length?`<b style="color:var(--warn)">${bad.length} sound off</b> (already ticked)`:"none flagged by the checker"} · ▶ plays a phrase</div>
    ${sw("fxAll","Show all phrases",!bad.length)}</div>
   <div id="fxList" style="max-height:52vh;overflow:auto;margin-top:6px"></div>
   ${r.video?sw("fxVid","Also fix the video (quick: only the sound is new)",true):`<div class="hint">No video made from this voice yet — only the voice is fixed.</div>`}
   <div class="actions"><button class="btn primary" id="fxGo">Remake ticked phrases</button><span class="hint" id="fxN"></span></div></div></div>`;
  const ts=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`,tick=new Set(bad.map(x=>x.n));
  const draw=()=>{const all=$("#fxAll").checked;$("#fxList").innerHTML=L.filter(x=>all||x.why.length||tick.has(x.n)).map(x=>`<label class="chkrow"><input type="checkbox" class="fxL" value="${x.n}" ${tick.has(x.n)?"checked":""}><span><b>${x.n}</b> ${esc(x.text)}${x.why.length?` <span class="hint" style="color:var(--warn)">— ${esc(x.why.join(", "))}</span>`:""} <a href="#" data-t="${x.start}" class="fxP">▶ ${ts(x.start)}</a></span></label>`).join("")||'<div class="empty">nothing flagged — switch on “Show all phrases”</div>';
    $$(".fxL").forEach(c=>c.onchange=()=>{c.checked?tick.add(+c.value):tick.delete(+c.value);cnt()});
    $$(".fxP").forEach(a=>a.onclick=e=>{e.preventDefault();const au=$("#fxAud");if(au){au.currentTime=Math.max(0,+a.dataset.t-0.3);au.play()}})};
  const cnt=()=>{$("#fxN").textContent=tick.size?`${tick.size} phrase(s): ${[...tick].sort((a,b)=>a-b).join(", ")}`:"nothing ticked"};
  $("#fxAll").addEventListener("change",draw);draw();cnt();
  $("#fxGo").onclick=e=>{if(!tick.size)return toast("Tick the phrases that sound wrong",1);const nums=[...tick].sort((a,b)=>a-b);
    if(r.video&&$("#fxVid").checked)return startGo("repair",{video:r.video,voice_lines:nums,quick:true},e.currentTarget);
    startGo("voice",{name:base(dir),redo:nums.join(","),takes:3},e.currentTarget)};
};

async function useScriptFile(name,file){try{const t=await (await fetch(media(file))).text();useScript(name,t)}catch(e){toast(e.message,1)}}
function useScript(n,t){go("voice");setTimeout(()=>{$("#vName").value=n;$("#vScript").value=t;$("#vScript").oninput()},80)}
async function openP(p){try{await api("/api/open",{path:p})}catch(e){toast(e.message,1)}}

// ---------------- RATINGS (app/feedback.py): very bad … very good on everything, AI pre-fills you can change
const RT={levels:{1:"Very bad",2:"Bad",3:"Avg",4:"Good",5:"Very good"},short:{1:"V.bad",2:"Bad",3:"Avg",4:"Good",5:"V.good"},cache:{},verdicts:{ok:"On time",early:"Too early",late:"Too late",wrong_sound:"Wrong sound",not_needed:"Not needed"}};
function rateBar(t,id,a="overall",o={}){if(!id)return "";return `<span class="rate${o.small?" sm":""}" data-t="${esc(t)}" data-id="${esc(id)}" data-a="${esc(a)}">${o.label?`<span class="rl">${esc(o.label)}</span>`:""}${[1,2,3,4,5].map(n=>`<button type="button" class="rs r${n}" data-s="${n}" title="${RT.levels[n]}">${o.small?RT.short[n]:RT.levels[n]}</button>`).join("")}<button type="button" class="rn" title="Add a note">✎</button><span class="rai"></span></span>`}
function verdictBar(id,extra){return `<span class="verdict" data-id="${esc(id)}" data-x="${esc(JSON.stringify(extra||{}))}">${Object.entries(RT.verdicts).map(([k,v])=>`<button type="button" class="vd" data-v="${k}">${v}</button>`).join("")}<button type="button" class="rn" title="Add a note">✎</button><span class="rai"></span></span>`}
async function rateLoad(root){root=root||document;const ids=[...new Set([...root.querySelectorAll(".rate,.verdict")].map(e=>e.dataset.id))].filter(x=>x&&!(x in RT.cache));
  for(let i=0;i<ids.length;i+=300){try{const r=await api("/api/rate/get",{ids:ids.slice(i,i+300)});ids.slice(i,i+300).forEach(id=>RT.cache[id]=r.ratings[id]||{})}catch(e){return}}
  root.querySelectorAll(".rate,.verdict").forEach(ratePaint)}
function ratePaint(el){const slot=((RT.cache[el.dataset.id]||{})[el.dataset.a||"timing"])||{},u=slot.user||{},a=slot.ai||{};
  el.querySelectorAll(".rs,.vd").forEach(b=>b.classList.remove("on","ai"));const key=el.classList.contains("verdict")?"verdict":"score",sel=el.classList.contains("verdict")?".vd[data-v":".rs[data-s";
  if(u[key])el.querySelector(`${sel}="${u[key]}"]`)?.classList.add("on");else if(a[key])el.querySelector(`${sel}="${a[key]}"]`)?.classList.add("ai");
  const n=el.querySelector(".rn"),note=u.note||"";n.classList.toggle("has",!!note);n.title=note?"Your note: "+note:"Add a note";
  const ai=el.querySelector(".rai");ai.textContent=(!u[key]&&a[key])?"AI":"";ai.title=a.note?"AI: "+a.note:""}
async function rateSave(el,patch){const slot=((RT.cache[el.dataset.id]||{})[el.dataset.a||"timing"])||{},u=slot.user||{};const verdict=el.classList.contains("verdict");
  const body={item_type:el.dataset.t||"cue",item_id:el.dataset.id,aspect:el.dataset.a||"timing",score:u.score||null,verdict:u.verdict||null,note:u.note||"",...patch};
  if(verdict){body.extra=JSON.parse(el.dataset.x||"{}");if(patch.verdict)body.score={ok:5,early:2,late:2,wrong_sound:1,not_needed:2}[patch.verdict]||null}
  try{await api("/api/rate/save",body);const c=RT.cache[el.dataset.id]=RT.cache[el.dataset.id]||{};c[body.aspect]=c[body.aspect]||{};c[body.aspect].user={score:body.score,verdict:body.verdict,note:body.note};
   document.querySelectorAll(".rate,.verdict").forEach(x=>{if(x.dataset.id==el.dataset.id&&(x.dataset.a||"timing")==body.aspect)ratePaint(x)})}catch(e){toast(e.message,1)}}
document.addEventListener("click",e=>{const b=e.target.closest(".rate .rs,.rate .rn,.verdict .vd,.verdict .rn");if(!b)return;e.preventDefault();e.stopPropagation();const el=b.closest(".rate,.verdict");
  const u=(((RT.cache[el.dataset.id]||{})[el.dataset.a||"timing"])||{}).user||{};
  if(b.classList.contains("rn")){const n=prompt("Note (what is wrong or good about it):",u.note||"");if(n!==null)rateSave(el,{note:n.trim()});return}
  if(b.classList.contains("vd")){const v=b.dataset.v;rateSave(el,{verdict:u.verdict==v?null:v,score:u.verdict==v?null:undefined});return}
  const s=+b.dataset.s;rateSave(el,{score:u.score==s?null:s})},true);

// ---------------- REVIEW one video: every part, every SFX cue, every picture

    <div>${verdictBar(c.id,{words:c.words,file:c.file,line:c.line})}<div style="margin-top:4px">${rateBar("sfx",c.file,"overall",{small:1,label:"this sound"})}</div></div></div>`}).join("");

  const pics=d.pictures.map(p=>`<div class="rthumb">${thumbAct(p.file,["View"])}${p.judge!=null?`<div class="hint">judge ${Math.round(p.judge)}/10</div>`:""}${rateBar("picture",p.file,"quality",{small:1,label:"quality"})}${rateBar("picture",p.file,"theme",{small:1,label:"theme"})}</div>`).join("");
  $("main").innerHTML=`<div class="simple"><button class="back" onclick="go('lib')">← Library</button><h1>Review</h1><p class="sub">${esc(base(video))} · ${esc(serName(P_.series))}. Your rating always wins over the AI's (shown as <span class="rai">AI</span>). Ratings steer the next Experimental runs.</p>
   <div class="card"><video id="rvVid" class="v" controls preload="metadata" src="${media(video)}" style="width:100%;max-height:52vh;background:#000"></video>
    <div class="rvrow" style="margin-top:10px"><b>Overall</b>${rateBar("video",video,"overall")}<div class="hint">${A.overall?"AI: "+esc(A.overall.note):""}</div></div>
    <div class="actions" style="margin-top:8px"><button class="btn" id="rvAI">Run AI self-review</button><span class="hint">${d.review&&d.review.time?"last AI review "+esc(d.review.time):"not reviewed by the AI yet"}</span><button class="btn small" onclick='openP(${J(P_.ep_dir)})'>Folder</button>${d.credits?`<button class="btn small" onclick='openP(${J(d.credits)})'>Credits needed</button>`:""}</div></div>
   <div class="card" style="margin-top:14px"><h2>Parts of this video</h2>${aspects}${clar}</div>
   <div class="card" style="margin-top:14px"><h2>Sound effects (${d.cues.length})</h2><div class="hint">▶ plays from just before the effect. Mark each one; “wrong sound” also counts against that file, so it is used less.</div><div class="list">${cues||'<div class="empty">No word-timed effects in this video.</div>'}</div></div>
   <div class="card" style="margin-top:14px"><h2>Script, voice and music</h2><div class="list">
    ${P_.script?`<div class="item"><div class="meta"><b>Script</b><small>${esc(base(P_.script))}</small></div><button class="btn small" onclick='openP(${J(P_.script)})'>Open</button>${rateBar("script",P_.script,"overall",{small:1})}</div>`:""}
    ${P_.narration?`<div class="item"><div class="meta"><b>Narration</b><small>${esc(base(P_.narration))}</small></div>${rateBar("narration",P_.narration,"overall",{small:1})}</div>`:""}
    ${P_.track?`<div class="item"><div class="meta"><b>Music</b><small>${esc(base(P_.track))}</small></div><audio controls preload="none" src="${media(P_.track)}"></audio>${rateBar("music",P_.track,"overall",{small:1})}</div>`:""}</div></div>
   <div class="card" style="margin-top:14px"><h2>Pictures (${d.pictures.length})</h2><div class="thumbs">${pics||'<div class="empty">No scene pictures found.</div>'}</div></div></div>`;
  $$("[data-seek]").forEach(b=>b.onclick=()=>{const v=$("#rvVid"),t=parseFloat(b.dataset.seek);if(isNaN(t))return;v.currentTime=Math.max(0,t-2);v.play();v.scrollIntoView({behavior:"smooth",block:"center"})});

R.queue=async()=>{$("main").innerHTML=`<div class="simple"><h1>Build queue</h1><p class="sub">Everything waiting for the graphics card, in the order it will build. Add episodes from any series page.</p><div class="card" id="mQ"><div class="empty">loading…</div></div></div>`;drawQueue(true)};
async function drawQueue(force){const el=$("#mQ");if(!el)return null;let q;try{q=await api("/api/queue")}catch(e){el.innerHTML=`<div class="empty">The build queue needs a hub restart to show (${esc(e.message)}).</div>`;return null}
  const key=JSON.stringify(q);if(!force&&el.dataset.k===key)return q;el.dataset.k=key;
  const tag=x=>`${x.series?esc(serName(x.series))+" · ":""}${x.experimental?"Experimental":"Working"}`,W=q.queued;
  const run=q.running.map(x=>`<div class="item" data-qid="${x.id}"><div class="meta"><b>▶ ${esc(x.title)}</b><small>${tag(x)} · building now · step ${(x.step||0)+1}/${x.n_steps}${x.step_label?" · "+esc(x.step_label):""}</small></div><button class="btn small" onclick="P.job='${x.id}';go('jobs')">Log</button></div>`).join("");
  const wait=W.map((x,i)=>{const top=i==0||W[i-1].resumes;return `<div class="item" data-qid="${x.id}"><div class="meta"><b>${x.position}. ${esc(x.title)}</b><small>${tag(x)}${x.resumes?" · carries on after a restart (always first)":""} · added ${ago(x.created)}</small></div>
    <button class="btn small" title="Move up" ${top||x.resumes?"disabled":""} onclick="qMove('${x.id}','up')">↑</button><button class="btn small" title="Move down" ${i==W.length-1||x.resumes?"disabled":""} onclick="qMove('${x.id}','down')">↓</button><button class="btn small" ${top||x.resumes?"disabled":""} onclick="qMove('${x.id}','next')">Run next</button><button class="btn small danger" onclick="qRemove('${x.id}')">Remove</button></div>`}).join("");
  el.innerHTML=(run||wait?`<div class="list">${run}${wait}</div>`:`<div class="empty">Nothing waiting. Fill in the form and click Make: each click adds one episode, from any series, and they build one after another.</div>`)
    +(q.beside.length?`<div class="hint" style="margin-top:8px">Running beside the queue (no graphics card): ${q.beside.map(x=>esc(x.title)).join(" · ")}</div>`:"")
    +`<div class="hint" style="margin-top:8px">One graphics-card job at a time, top to bottom. The order is kept if the hub restarts; a job cut short by a restart carries on first. Working-mode jobs share this line.</div>`;return q}
async function qMove(id,to){try{await api("/api/queue/move",{id,to});drawQueue(true)}catch(e){toast(e.message,1)}}
async function qRemove(id){if(!confirm("Take this job out of the queue? It stays in Activity as stopped; Run again there puts it back."))return;try{await api("/api/queue/remove",{id});drawQueue(true)}catch(e){toast(e.message,1)}}

let JOBS=[];
function drawJobs(){const el=$("#jl");if(!el)return;const key=JOBS.map(j=>`${j.id}:${j.status}:${j.stopping?1:0}:${j.pausing?1:0}:${j.step}:${j.title}`).join("|")+"|selected:"+P.job;if(el.dataset.renderKey===key)return;el.dataset.renderKey=key;el.innerHTML=JOBS.map(j=>`<div class="job ${j.id==P.job?"on":""}" data-id="${j.id}" onclick="selJob('${j.id}')"><b>${esc(j.title)}<span class="badge ${j.status}">${j.stopping&&j.status=="running"?"stopping…":j.pausing&&j.status=="running"?"pausing…":j.status}</span>${["done","failed","stopped"].includes(j.status)?`<span class="jx" title="Remove from the list" onclick="event.stopPropagation();clearJobs(['${j.id}'])">✕</span>`:""}</b><small>${new Date(j.created*1000).toLocaleString()}${["running","paused","stopped","failed"].includes(j.status)&&j.n_steps?` · step ${Math.min(j.step+1,j.n_steps)}/${j.n_steps}`:""}</small></div>`).join("")||'<div class="empty">No jobs yet.</div>'}
async function clearJobs(ids){const r=await api("/api/jobs/clear",{ids:ids||[]});toast(`${r.cleared} job(s) cleared`);if(ids&&ids.includes(P.job))P.job=null;await refreshJobs();if(P.page=="jobs")R.jobs()}
function colorLog(t){return esc(t).replace(/^(?!\s*&gt; )(.*(!!|Traceback|\bError\b|finished with code|did not succeed).*)$/gm,'<span class="e">$1</span>').replace(/^(\[\d+\/\d+\].*)$/gm,'<span class="s">$1</span>').replace(/^(DONE.*)$/gm,'<span class="d">$1</span>')}
function appendLog(el,text,scroll=true){if(!el||!text)return;const atEnd=el.scrollTop+el.clientHeight>=el.scrollHeight-30;el.insertAdjacentHTML("beforeend",colorLog(text));if(el.textContent.length>350000){el.textContent="[Earlier log lines trimmed in viewer]\n"+el.textContent.slice(-240000)}if(scroll&&atEnd)el.scrollTop=el.scrollHeight}

async function loadJobNotes(id){const list=$("#jobNoteList"),save=$("#jobNoteSave"),status=$("#jobNoteStatus");if(!list||!save||!status)return;const job=JOBS.find(x=>x.id===id);const activity=job?`${job.title} (${id})`:id;status.textContent=`Loading notes for ${activity}…`;list.innerHTML="";save.disabled=true;save.textContent="Save note to selected activity";save.onclick=async()=>{if(P.job!==id)return;const note=$("#jobNoteText").value.trim();if(!note){status.textContent="Write a note first; nothing was saved.";return}save.disabled=true;status.textContent=`Saving note to ${activity}…`;try{const out=await api(`/api/jobs/${encodeURIComponent(id)}/notes`,{note,stage:$("#jobNoteStage").value,result:$("#jobNoteResult").value});if(P.job!==id)return;$("#jobNoteText").value="";await loadJobNotes(id);status.textContent=`Saved to ${activity} at ${out.entry.time}. This note is attached only to this activity.`;toast("Activity note saved")}catch(e){if(P.job===id){save.disabled=false;status.textContent=`Could not save to ${activity}: ${e.message}`;toast(e.message,1)}}};try{const r=await api(`/api/jobs/${encodeURIComponent(id)}/notes`);if(P.job!==id)return;const notes=r.notes||[];status.textContent=`Notes for ${activity} · ${notes.length} saved`;if($("#jobNoteCount"))$("#jobNoteCount").textContent=notes.length?`· ${notes.length} saved`:"";list.innerHTML=notes.map(n=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(n.stage)} · ${n.result==="worked"?"Worked":"Issue"}</b><small style="margin-left:8px">${esc(n.time||"")}</small><div style="white-space:pre-wrap;margin-top:4px">${esc(n.note)}</div></div>`).join("")||'<span class="hint">No notes saved for this activity yet.</span>';save.disabled=false}catch(e){if(P.job===id){status.textContent=`Could not load notes for ${activity}: ${e.message}`;list.textContent=""}}}
async function pollJob(first){if(P.page!="jobs"||!P.job||!$("#jlog"))return;const j=JOBS.find(x=>x.id==P.job);
